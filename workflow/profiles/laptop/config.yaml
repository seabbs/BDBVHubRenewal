# A 16-core, 64 GB laptop helping archie: simulates the seeds
# `simulate.hosts` names for it and pushes each batch to archie
# (`task push`). Four cores and 16 GB stay free for its user, and its
# GPU for the trainer. With no memory cgroups on macOS, set
# JOB_PREFIX="workflow/scripts/mem_cap.sh {mem}" in config/local.env.
#
#   task push ROUNDS="19 18"   (SIM_PROFILE=laptop in config/local.env)
rerun-triggers: [mtime]
printshellcmds: true
keep-going: true
latency-wait: 30
cores: 12
default-resources:
  - mem_mb=2048
set-threads:
  - simulate_batch=1
resources:
  - sim_slots=4
  - mem_mb=49152
