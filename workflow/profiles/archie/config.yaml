# archie, the rounds host: simulates its seeds of each round (all but
# those `simulate.hosts` names for another host), waits for the rest,
# then runs the QC. Eight batches at a time, as its rounds run.
#
#   task simulate ROUNDS="10 11"   (SIM_PROFILE=archie in config/local.env)
rerun-triggers: [mtime]
printshellcmds: true
keep-going: true
latency-wait: 30
cores: 9
default-resources:
  - mem_mb=2048
set-threads:
  - simulate_batch=1
resources:
  - sim_slots=8
  - awaiting=1
