<div class=expandable id=gview>
<div class=gctl>
<label id=gdsl hidden>Dataset <select id=gds></select></label>
<label id=gtgtl hidden>Target <select id=gtgt></select></label>
<label>Source <select id=gsrc>{sources}</select></label>
<label class=gwide>Nowcast date <button id=gprev>&lt;</button>
<input type=range id=gsl><button id=gnext>&gt;</button>
<b id=gdate></b></label>
<label class=gwide><button id=gplay>Play</button>
<select id=gspd><option value=0.5>0.5x</option>
<option value=1 selected>1x</option><option value=2>2x</option></select>
</label>
<label>View <select id=gmode><option value=0>one nowcast date</option>
<option value=1>nowcasts over time</option></select></label>
<label id=gmodl hidden>Model <select id=gmod></select></label>
<label id=gndl hidden>Origins <select id=gnd><option>2</option><option>3</option>
<option>4</option><option>6</option><option>8</option><option>12</option></select></label>
<label id=gstepl hidden>every <select id=gstep><option value=1>1 week</option>
<option value=2>2 weeks</option><option value=4>4 weeks</option></select>
</label>
<label>y-axis fits <select id=gyfit><option value=0>90% (or 95%) intervals</option>
<option value=1>50% intervals</option><option value=2>truth and medians</option></select>
</label>
<label><input type=checkbox id=gylog> log y</label>
<label>intervals <select id=gbands><option value=0>50% and 90% (or 95%)</option>
<option value=1>50% only</option><option value=2>none</option></select>
</label></div>
<details class=glocs><summary id=gsum>Locations</summary>
<div id=glocs></div></details>
<div id=gck class=gck></div>
<div class=gwrap id=gwrap><div class=card><div class=cardinfo>{tip}</div><div id=gplot></div></div>
<div class=card><div id=gwis></div></div></div>
</div>
