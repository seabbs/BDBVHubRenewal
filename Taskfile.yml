version: "3"

env:
  UV_CACHE_DIR: '{{.UV_CACHE_DIR | default (printf "%s/uvcache" (env "TMPDIR" | default "/tmp"))}}'
  MPLCONFIGDIR: '{{.MPLCONFIGDIR | default (printf "%s/mplconfig" (env "TMPDIR" | default "/tmp"))}}'

tasks:
  setup:
    desc: Install the package with the dev and docs groups
    cmds:
      - uv sync --all-groups

  test:
    desc: Run the tests with coverage
    cmds:
      - uv run pytest -q --cov=bdbvhubrenewal

  test-slow:
    desc: Run the model fit tests (tiny real fits)
    cmds:
      - uv run pytest -q -m slow

  test-all:
    desc: Run every test, the model fit tests included, as the CI does
    cmds:
      - task: test
      - task: test-slow

  lint:
    desc: Lint, check formatting and type-check
    cmds:
      - uv run ruff check src tests
      - uv run ruff format --check src tests
      - uv run mypy src

  format:
    desc: Format and fix lint where safe
    cmds:
      - uv run ruff format src tests
      - uv run ruff check --fix src tests

  data:
    desc: Download every hub data vintage and rebuild the tidy tables in data/
    cmds:
      - uv run bdbvhubrenewal data

  data-bvd:
    desc: Cache the BVDOutbreakSize releases each backtest vintage may use in data/bvd/ (for renewalbvd)
    cmds:
      - uv run bdbvhubrenewal bvd {{.CLI_ARGS}}

  backtest:
    desc: Run the development backtest (real and reconstructed) and the recovery check (simulated)
    cmds:
      - uv run bdbvhubrenewal backtest {{.CLI_ARGS}}

  backtest-lopo:
    desc: Leave one province out on the development vintages, for the variants that take a mask
    cmds:
      - uv run bdbvhubrenewal backtest --lopo {{.CLI_ARGS}}

  backtest-heldout:
    desc: Score every held-out vintage under the model chosen at the time (needs results/model-choice.yml)
    cmds:
      - uv run bdbvhubrenewal backtest --evaluate-holdout

  nowcast:
    desc: Forecast from the latest vintage and write a checked hub file to output/submission/
    cmds:
      - uv run bdbvhubrenewal nowcast {{.CLI_ARGS}}

  metadata:
    desc: Write and check the metadata of both hub models in hub/model-metadata/
    cmds:
      - uv run bdbvhubrenewal metadata --model persistencenow --out hub/model-metadata
      - uv run bdbvhubrenewal metadata --model renewal --out hub/model-metadata

  validate-hub:
    desc: Check the nowcast file and metadata with hub_validate (Python) and hubValidations (R)
    deps: [metadata]
    vars:
      MODEL: '{{.MODEL | default "persistencenow"}}'
      ID:
        sh: uv run --quiet bdbvhubrenewal hub-id --model {{.MODEL}}
    env:
      R_CACHE_ROOTPATH: '{{.R_CACHE_ROOTPATH | default (printf "%s/rcache" (env "TMPDIR" | default "/tmp"))}}'
    cmds:
      - uv run bdbvhubrenewal nowcast --model {{.MODEL}}
      - rm -rf output/hub
      - git clone --depth 1 -q https://github.com/InsightNet-US/BDBV-Modeling-Hub.git output/hub
      - >-
        uv run bdbvhubrenewal validate --hub output/hub --skip-window
        --metadata-dir hub/model-metadata
        $(ls output/submission/model-output/{{.ID}}/*.csv | tail -n 1)
        hub/model-metadata/{{.ID}}.yml
      - >-
        Rscript scripts/validate-hub.R output/hub
        $(ls output/submission/model-output/{{.ID}}/*.csv | tail -n 1)
        hub/model-metadata/{{.ID}}.yml

  ci-test:
    desc: Lint, type-check and test the submission CI scripts in ci/
    dir: ci
    cmds:
      - uv run ruff check src tests fixtures
      - uv run ruff format --check src tests fixtures
      - uv run mypy
      - uv run pytest -q

  submission-preflight:
    desc: Check every prerequisite of a live submission that can be read, and print what is missing (needs gh as a repo admin)
    vars:
      MODEL_ID: '{{.MODEL_ID | default "seabbs-renewal"}}'
    cmds:
      - rm -rf output/hub
      - git clone --depth 1 -q https://github.com/InsightNet-US/BDBV-Modeling-Hub.git output/hub
      - >-
        if [ -f hub/model-metadata/{{.MODEL_ID}}.yml ]; then
        uv run bdbvhubrenewal validate --hub output/hub
        hub/model-metadata/{{.MODEL_ID}}.yml; fi
      - uv run --quiet --project ci submission-preflight {{.CLI_ARGS}}

  ci-dry:
    desc: "Dry run of the submission workflow on fixture data (all scenarios, or one: task ci-dry -- retry)"
    cmds:
      - ci/run_dry.sh {{.CLI_ARGS}}

  ci-fit:
    desc: "Fit one fit config and forecast from it, as a CI candidate does (CONFIG=main by default)"
    vars:
      CONFIG: '{{.CONFIG | default "main"}}'
    cmds:
      - rm -rf output/fits/{{.CONFIG}}
      - uv run bdbvhubrenewal fit --config {{.CONFIG}} --out output/fits/{{.CONFIG}} {{.CLI_ARGS}}
      - uv run bdbvhubrenewal nowcast --config {{.CONFIG}} --fit output/fits/{{.CONFIG}} --out output/candidates/{{.CONFIG}}

  compare-hub:
    desc: Fetch the hub's weekly-round forecasts and score them with ours
    cmds:
      - uv run bdbvhubrenewal compare-hub --fetch

  plots:
    desc: Make the docs figures and tables from the backtest results
    cmds:
      - uv run bdbvhubrenewal compare-hub
      - uv run bdbvhubrenewal report

  docs:
    desc: Build the docs site into _site/
    cmds:
      - task: plots
      - uv run mkdocs build --strict

  serve:
    desc: Serve the docs locally
    cmds:
      - task: plots
      - uv run mkdocs serve
