version: "3"

# Machine settings (config/local.env, see config/local.env.example) are
# read here too, so CORES and MEM_MB are set once for Task and Snakemake.
dotenv: ["config/local.env"]

vars:
  SNAKEMAKE: uv run --group paper snakemake

env:
  UV_CACHE_DIR: '{{.UV_CACHE_DIR | default (printf "%s/uvcache" (env "TMPDIR" | default "/tmp"))}}'
  MPLCONFIGDIR: '{{.MPLCONFIGDIR | default (printf "%s/mplconfig" (env "TMPDIR" | default "/tmp"))}}'

tasks:
  setup:
    desc: Install the package with the dev and docs groups
    cmds:
      - uv sync --all-groups

  test:
    desc: Run the tests with coverage
    cmds:
      - uv run pytest -q --cov=bdbvhubrenewal

  test-slow:
    desc: Run the parameter recovery fit (marked slow)
    cmds:
      - uv run pytest -q -m slow

  test-all:
    desc: Run every test, the model fit tests included, as the CI does
    cmds:
      - task: test
      - task: test-slow

  lint:
    desc: Lint, check formatting and type-check
    cmds:
      - uv run ruff check src tests workflow scripts
      - uv run ruff format --check src tests workflow scripts
      - uv run mypy src

  format:
    desc: Format and fix lint where safe
    cmds:
      - uv run ruff format src tests workflow scripts
      - uv run ruff check --fix src tests workflow scripts

  data:
    desc: Download every hub data vintage and rebuild the tidy tables in data/ (not committed; the tests read tests/fixtures/data/)
    cmds:
      - uv run bdbvhubrenewal data

  data-bvd:
    desc: Cache the BVDOutbreakSize releases each backtest vintage may use in data/bvd/ (for renewalbvd)
    cmds:
      - uv run bdbvhubrenewal bvd {{.CLI_ARGS}}

  fit-store:
    desc: Load the fitted models' stored fits into results/ (fetches the fit-store branch)
    run: once
    cmds:
      - scripts/fit-store.sh fetch output/fit-store
      - uv run bdbvhubrenewal fit-store load --store output/fit-store

  fit-store-plan:
    desc: List the fits the store lacks for this code and data
    cmds:
      - scripts/fit-store.sh fetch output/fit-store
      - uv run bdbvhubrenewal fit-store plan --store output/fit-store

  backtest:
    desc: Run the development backtest, the real-release evaluation and the recovery check (simulated), with the fitted models from the fit store
    cmds:
      - task: fit-store
      - uv run bdbvhubrenewal backtest {{.CLI_ARGS}}

  score-history:
    desc: Write results/score-history.csv, the backtest scores of each deploy from main, and print relative CRPS by deploy
    cmds:
      - git fetch -q origin gh-pages
      - uv run python scripts/score_history.py {{.CLI_ARGS}}

  # The same commands as the backtest jobs of .github/workflows/pages.yml;
  # keep the two in step.
  results:
    desc: Make every derived file in results/ as the Pages build does (the backtest, zone and scenario runs)
    cmds:
      - task: backtest
      - uv run bdbvhubrenewal zone-backtest
      - uv run bdbvhubrenewal backtest --scenarios-only

  backtest-lopo:
    desc: Leave one province out on the development vintages, for the variants that take a mask
    cmds:
      - uv run bdbvhubrenewal backtest --lopo {{.CLI_ARGS}}

  backtest-scenarios:
    desc: Forecast the simulated scenarios calibrated to the latest real vintage (writes results/scenario-scores.csv.gz)
    cmds:
      - uv run bdbvhubrenewal backtest --scenarios-only {{.CLI_ARGS}}

  backtest-zones:
    desc: Score randomwalk and randomwalknowcast at health-zone level (writes results/zone-scores.csv)
    cmds:
      - uv run bdbvhubrenewal zone-backtest {{.CLI_ARGS}}

  germany:
    desc: Run and score the German hospitalisation nowcast benchmark and its hub teams (writes results/germany/)
    cmds:
      - uv run bdbvhubrenewal germany-fetch
      - uv run bdbvhubrenewal germany-backtest {{.CLI_ARGS}}
      - uv run bdbvhubrenewal germany-teams
      - uv run bdbvhubrenewal germany-asof
      - uv run bdbvhubrenewal germany-paper

  nowcast:
    desc: Forecast from the latest vintage and write a checked hub file to output/submission/
    cmds:
      - uv run bdbvhubrenewal nowcast {{.CLI_ARGS}}

  metadata:
    desc: Write and check the metadata of the hub models in hub/model-metadata/
    cmds:
      - uv run bdbvhubrenewal metadata --model randomwalk --out hub/model-metadata
      - uv run bdbvhubrenewal metadata --model randomwalknowcast --out hub/model-metadata
      - uv run bdbvhubrenewal metadata --model fm_chronos_daily_ragged_ft --out hub/model-metadata

  validate-hub:
    desc: Check the nowcast file and metadata with hub_validate (Python) and hubValidations (R)
    deps: [metadata]
    vars:
      MODEL: '{{.MODEL | default "randomwalknowcast"}}'
      ID:
        sh: uv run --quiet bdbvhubrenewal hub-id --model {{.MODEL}}
    env:
      R_CACHE_ROOTPATH: '{{.R_CACHE_ROOTPATH | default (printf "%s/rcache" (env "TMPDIR" | default "/tmp"))}}'
    cmds:
      - uv run bdbvhubrenewal nowcast --model {{.MODEL}}
      - rm -rf output/hub
      - git clone --depth 1 -q https://github.com/InsightNet-US/BDBV-Modeling-Hub.git output/hub
      - >-
        uv run bdbvhubrenewal validate --hub output/hub --skip-window
        --metadata-dir hub/model-metadata
        $(ls output/submission/model-output/{{.ID}}/*.csv | tail -n 1)
        hub/model-metadata/{{.ID}}.yml
      - >-
        Rscript scripts/validate-hub.R output/hub
        $(ls output/submission/model-output/{{.ID}}/*.csv | tail -n 1)
        hub/model-metadata/{{.ID}}.yml

  ci-test:
    desc: Lint, type-check and test the submission CI scripts in ci/
    dir: ci
    cmds:
      - uv run ruff check src tests fixtures
      - uv run ruff format --check src tests fixtures
      - uv run mypy
      - uv run pytest -q

  submission-preflight:
    desc: Check every prerequisite of a live submission that can be read, and print what is missing (needs gh as a repo admin)
    vars:
      # The ids with `submit = true` in config/hub.toml, unless set.
      MODEL_IDS:
        sh: >-
          echo "{{.MODEL_ID}}" | grep . ||
          uv run --quiet --project ci submission-preflight --print-submitting
    cmds:
      - rm -rf output/hub
      - git clone --depth 1 -q https://github.com/InsightNet-US/BDBV-Modeling-Hub.git output/hub
      - >-
        for id in {{.MODEL_IDS}}; do
        if [ -f hub/model-metadata/$id.yml ]; then
        uv run bdbvhubrenewal validate --hub output/hub
        hub/model-metadata/$id.yml; fi; done
      - uv run --quiet --project ci submission-preflight {{.CLI_ARGS}}

  ci-dry:
    desc: "Dry run of the submission workflow on fixture data (all scenarios, or one: task ci-dry -- fallback)"
    cmds:
      - ci/run_dry.sh {{.CLI_ARGS}}

  ci-fit:
    desc: "Fit one fit config and forecast from it, as a CI candidate does (CONFIG=main by default)"
    vars:
      CONFIG: '{{.CONFIG | default "main"}}'
    cmds:
      - rm -rf output/fits/{{.CONFIG}}
      - uv run bdbvhubrenewal fit --config {{.CONFIG}} --out output/fits/{{.CONFIG}} {{.CLI_ARGS}}
      - uv run bdbvhubrenewal nowcast --config {{.CONFIG}} --fit output/fits/{{.CONFIG}} --out output/candidates/{{.CONFIG}}

  compare-hub:
    desc: Fetch the hub's weekly-round forecasts and score them with ours
    cmds:
      - uv run bdbvhubrenewal compare-hub --fetch

  plots:
    desc: Make the docs figures and tables from the backtest results
    cmds:
      - task: fit-store
      - uv run bdbvhubrenewal compare-hub
      - uv run bdbvhubrenewal report
      - >-
        uv run python scripts/score_history.py --docs docs/generated
        --figures docs/figures --current docs/figures
        --out output/score-history.csv

  getting-started:
    desc: Run the Getting started notebook again and save its outputs
    cmds:
      - task: fit-store
      - >-
        uv run --group docs jupytext --to ipynb --execute --run-path .
        docs/getting-started.py

  # The top-level workflow (workflow/Snakefile, workflow/README.md). Each
  # task runs a target; pass more Snakemake options after `--`, such as
  # `task score -- -n` for a dry run or a file to build one output.
  # Every target runs with workflow/profiles/default and this machine's
  # cores and resources less its headroom (flowlib.machine), or with the
  # untracked profile SNAKEMAKE_PROFILE names (see config/profile.example).
  wf:
    internal: true
    cmds:
      - >-
        {{.SNAKEMAKE}} {{.WF_TARGET}}
        {{if .SNAKEMAKE_PROFILE}}--workflow-profile {{.SNAKEMAKE_PROFILE}}
        {{else}}--workflow-profile workflow/profiles/default
        $(python3 workflow/flowlib/machine.py args){{end}}
        {{.CLI_ARGS}}

  all:
    desc: Run every workflow target that writes nothing outside this machine (simulate, finetune, score)
    cmds:
      - task: wf
        vars: {WF_TARGET: all}

  simulate:
    desc: Simulate the rounds in ROUNDS (for example ROUNDS=4 or ROUNDS="4 5"), with QC and manifests
    cmds:
      - task: wf
        vars:
          WF_TARGET: 'simulate --config "rounds=[{{.ROUNDS | default "" | splitList " " | join ","}}]"'

  push:
    desc: Simulate this host's seeds (SIM_SEEDS) of ROUNDS and push each batch to the rounds host (REMOTE)
    cmds:
      - task: wf
        vars:
          WF_TARGET: 'push --config "rounds=[{{.ROUNDS | default "" | splitList " " | join ","}}]"'

  release:
    desc: Upload each simulated batch of ROUNDS to its sims-r<N> release (writes GitHub releases)
    cmds:
      - task: wf
        vars:
          WF_TARGET: 'release --config "rounds=[{{.ROUNDS | default "" | splitList " " | join ","}}]"'

  finetune:
    desc: Train every checkpoint prefix of the fine-tuning run, one segment at a time on the GPU
    cmds:
      - task: wf
        vars: {WF_TARGET: finetune}

  publish:
    desc: Verify and release every finished checkpoint (writes GitHub releases)
    cmds:
      - task: wf
        vars: {WF_TARGET: publish}

  score:
    desc: Score every released checkpoint (German, BDBV, held-out), then the slots check and aggregation rows; the releases are listed afresh in a run of their own first
    cmds:
      - task: wf
        vars: {WF_TARGET: "release_list --forcerun release_list"}
      - task: wf
        vars: {WF_TARGET: score}

  land:
    desc: Commit the checkpoint score tables to evidence/ and push (writes to GitHub)
    cmds:
      - task: wf
        vars: {WF_TARGET: land}

  dashboard:
    desc: Serve the fine-tuning dashboard on 127.0.0.1 (PORT=8765); runs from workflow/config.yaml, DASHBOARD_RUNS and `-- --run name=<folder|prefix>`
    cmds:
      - uv run --group paper python workflow/scripts/dashboard.py --port {{.PORT | default 8765}} {{.CLI_ARGS}}

  dashboard:static:
    desc: Write the dashboard once as a static page (<RUN>/reports/dashboard.html)
    cmds:
      - task: wf
        vars: {WF_TARGET: "dashboard --forcerun dashboard"}

  monitor:
    desc: Serve the workflow monitor, each machine's running and recent jobs from the status the ticks write (MONITOR_HOST, MONITOR_PORT, MONITOR_REFRESH in config/local.env)
    cmds:
      - python3 workflow/scripts/monitor.py

  tick:
    desc: Run this machine's scheduled workflow targets once (SCHEDULE_TARGETS in config/local.env), with the lock and room checks a timer uses
    cmds:
      - python3 workflow/scripts/tick.py

  schedule:
    desc: Show, install or remove the timer that runs `task tick` every SCHEDULE_EVERY minutes (ACTION=show|install|uninstall)
    cmds:
      - python3 workflow/scripts/schedule.py {{.ACTION | default "show"}}

  dag:
    desc: Draw the workflow's rule graph (TARGET=all by default) as workflow-dag.svg
    cmds:
      - "{{.SNAKEMAKE}} {{.TARGET | default \"all\"}} --rulegraph | dot -Tsvg > workflow-dag.svg"

  progress:
    desc: Show which workflow outputs exist and which would run (TARGET=all by default)
    cmds:
      - "{{.SNAKEMAKE}} {{.TARGET | default \"all\"}} --summary"

  report:
    desc: Write Snakemake's browsable HTML report of the workflow (workflow-report.html)
    cmds:
      - "{{.SNAKEMAKE}} {{.TARGET | default \"all\"}} --report workflow-report.html"

  workflow:check:
    desc: Test the workflow's helpers and dry-run every target, as CI does
    cmds:
      - uv run --group paper pytest -q tests/workflow

  paper:
    desc: Run the paper workflow (TARGET=development by default, or paper) and render the paper into docs/paper/, as CI does (scripts/paper.sh), niced on this machine's cores less its headroom, with start, done or FAILED lines; TARGET=paper waits for the held-out inputs and pins the newest checkpoint first
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py {{.TARGET | default "development"}}

  paper:targets:
    desc: "Run single paper workflow targets the same way: task paper:targets -- TARGET..."
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py --targets {{.CLI_ARGS}}

  paper:render:
    desc: Alias of `task paper`
    cmds:
      - task: paper

  docs:
    desc: Build the docs site into _site/
    cmds:
      - task: results
      - task: plots
      - task: getting-started
      - task: paper
      - uv run mkdocs build --strict

  serve:
    desc: Serve the docs locally (run `task results` once first)
    cmds:
      - task: plots
      - uv run mkdocs serve
