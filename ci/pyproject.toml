[project]
name = "submission-ci"
version = "0.1.0"
description = "Automated, gated submission of forecasts to the BDBV Modeling Hub"
requires-python = ">=3.11"
# Standard library only, so the CI steps start in seconds and never
# depend on the model's environment.
dependencies = []

[project.scripts]
detect-new-vintage = "submission_ci.detect_new_vintage:main"
fit-key = "submission_ci.fit_key:main"
summarise-fit = "submission_ci.summarise_fit:main"
check-forecast = "submission_ci.check_forecast:main"
check-coherence = "submission_ci.check_coherence:main"
build-pr-body = "submission_ci.build_pr_body:main"
open-or-update-pr = "submission_ci.open_or_update_pr:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.uv.build-backend]
module-name = "submission_ci"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PT",
  "PTH", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Compound assertions read better than split ones for these checks.
"tests/**" = ["PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
