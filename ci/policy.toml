# Fallback chain and gate thresholds for automated hub submissions.
# Problems are handled rather than failed on, so the chain rarely moves
# past the main model: a candidate is ruled out only when its fit is
# clearly broken or its file would be invalid on the hub. See
# src/submission_ci/policy.py and src/submission_ci/select_candidate.py.

[policy]
# One refit of the main model, only when `main` is past the convergence
# retry thresholds or was ruled out. No other refits, to stay fast; the
# content-hash fit cache is reused across re-runs.
retry_budget = 1

[cache]
# Everything a fit depends on in the main repo, listed once. The fit
# cache key hashes these with the hub data commit and the candidate's
# config and sampler settings.
inputs = ["src", "config", "pyproject.toml", "uv.lock"]

[[candidates]]
id = "main"
kind = "main"
config = "main"
stage = "primary"
label = "main model"
sampler = { num_chains = 4, num_warmup = 1000, num_samples = 1000, target_accept = 0.8, max_tree_depth = 10, seed = 1 }

[[candidates]]
id = "retry-1"
kind = "retry"
config = "main"
stage = "retry"
label = "main model, refitted (longer warm-up, smaller steps, jittered inits)"
# The same number of NUTS iterations as `main` (4 x 2000), spent on a
# longer warm-up. Main fits reach the maximum tree depth on nearly every
# draw, so cost follows iterations and the retry takes about as long as
# main. Main and the retry then fit the 540 minutes from the last Tuesday
# start, with each job well under its 350-minute cap. More chains than
# the runner's 4 vCPUs would only slow every chain down.
sampler = { num_chains = 4, num_warmup = 1500, num_samples = 500, target_accept = 0.95, max_tree_depth = 10, seed = 2, init = "jitter" }

[[candidates]]
id = "fallback"
kind = "fallback"
config = "fallback"
# Fitted alongside `main`, not after it, so that a failed main model
# does not leave too little of the window to fit the fallback.
stage = "primary"
label = "fallback variant (no spatial coupling, delays and missingness fixed from the data)"
sampler = { num_chains = 4, num_warmup = 1000, num_samples = 1000, target_accept = 0.9, max_tree_depth = 10, seed = 1 }

# A shadow: fitted and checked weekly with the primary stage, never
# submitted, until the model choice picks it.
[[candidates]]
id = "bvd"
kind = "shadow"
config = "bvd"
stage = "primary"
label = "BVDOutbreakSize-informed variant (shadow, not submitted)"
sampler = { num_chains = 4, num_warmup = 1000, num_samples = 1000, target_accept = 0.9, max_tree_depth = 10, seed = 1 }

[[candidates]]
id = "persistence"
kind = "persistence"
config = "persistence"
stage = "baseline"
label = "persistence baseline"

# Convergence thresholds. `retry` and `warn` are the fail and warn
# defaults of BVDOutbreakSize's gate (docs/fits/convergence.jl): past
# `retry` the main model is refitted once, and the refit is accepted
# unless it is clearly broken (`fail`), which alone rules a fit out.
# Each can be overridden by an environment variable or repo variable:
# BDBV_CONVERGENCE_{FAIL,RETRY,WARN}_{RHAT,ESS_BULK,ESS_TAIL,DIVERGENT}.
[convergence.fail]
rhat = 1.5
ess_bulk = 10
ess_tail = 10
divergent_fraction = 0.2

[convergence.retry]
rhat = 1.1
ess_bulk = 25
ess_tail = 25
divergent_fraction = 0.05

[convergence.warn]
rhat = 1.05
ess_bulk = 100
ess_tail = 100
divergent_fraction = 0.01

# Posterior predictive checks on the fit's ppc.json (check_ppc.py).
# Coverage is the share of observed counts inside the predictive
# interval of `level`, for `stream`, over every in-sample week and over
# the last `recent_weeks` complete weeks. A model with no posterior is
# n/a. Each value can be overridden by an environment variable or repo
# variable BDBV_PPC_<KEY>, for example BDBV_PPC_COVERAGE_WARN.
# Posterior predictive checks: reported only, never gated. Below
# `coverage_warn` the PR warns; below `coverage_fail` it calls the
# coverage poor. Model choice comes from the backtest.
[ppc]
stream = "total"
level = 0.9
coverage_warn = 0.70
coverage_fail = 0.50
recent_weeks = 4
# Kolmogorov-Smirnov distance of the randomised PIT from uniform. It
# only warns, and only with enough rows to say anything.
pit_ks_warn = 0.2
pit_min_rows = 20

# Plausibility and consistency checks on the forecast file. Ratios are
# symmetric: a ratio r is breached when the value is above r times or
# below 1/r times the reference. A threshold of 0 turns a level off.
# Only the format checks (schema, values, samples) fail; the national
# sum is rebuilt by construction, and the plausibility checks only warn.
[checks]
samples = 100
horizon_weeks = 3          # target end dates required after the reference date
nowcast_weeks = 4          # back weeks required up to the reference date
national = "CD"
# National is rebuilt as the sum of the provinces plus the unassigned
# component (national.json, or the data's national gap without it), so
# it is exact by construction.
sum_tolerance = 1e-9       # absolute (or 1e-12 relative)
# Upper bound on any trajectory: the 95th centile of a week, relative to
# the largest weekly count the location has ever had (floored).
bound_floor = 20
bound_warn = 5
bound_fail = 0
# Week-on-week growth of the median trajectory over the forecast weeks.
growth_warn = 2.0
growth_fail = 0
# Median of the submitted back weeks against the observed counts in the
# last complete weeks (weeks ending at least `complete_lag_weeks` before
# the data vintage). Counts are offset by `ratio_offset` first.
complete_lag_weeks = 4
complete_weeks = 2
ratio_offset = 5
observed_warn = 2.0
observed_fail = 0
# Median of the forecast weeks against the persistence baseline. A
# departure is flagged, never failed.
baseline_warn = 3.0
baseline_fail = 0
# Median of the weeks shared with last week's submission. Revisions are
# expected, so this only warns.
previous_warn = 2.0
previous_fail = 0
