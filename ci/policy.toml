# Fallback chain and gate thresholds for automated hub submissions.
# seabbs-renewal walks the candidates in order, from the most to the
# least complex renewal model, then the random walks, and submits the
# first that passes its checks. `[submission] model` in config/hub.toml
# says where the chain starts. Only seabbs-rwnowcast has no fallback
# (ci/steps/track.sh).

# There are no refits: a candidate past the convergence thresholds is
# ruled out and the chain moves on. Each fitted candidate reads the fit
# store's fit of the same code and data (fit-store.yml); the submission
# never fits.

# Minutes the chain plans with. On hosted runners (4 vCPU), at the
# 2026-11-01 vintage with the two chains of each fit in parallel,
# sampling took 250 min for renewalbvd (500 + 1000 draws), 170 min for
# renewal and 63 min for renewalsp (500 + 500) after province delays
# came in. With the current 500 + 750 draws and a faster gradient, about
# 115 min is expected for renewalbvd and renewal and 68 min for
# renewalsp. Nearly every renewalbvd and renewal draw reaches the
# maximum tree depth, so cost follows iterations times the cost of a gradient.
# Every renewal candidate fits in its own job at the same time, and
# random walk is built in `prepare`.
[timing]
# GitHub's 360-minute job cap, less a margin.
fit_cap_minutes = 350
# Kept free before the window closes for the gate (hubValidations)
# and the pull request. Every fit job's timeout stops this short of the
# close, so the gate always runs in time with the fallback or randomwalk.
reserve_minutes = 45
# The shortest timeout a fit job gets, however late it starts.
min_fit_minutes = 30

[[candidates]]
id = "bvd"
kind = "main"
config = "bvd"
model = "renewalbvd"
stage = "primary"
label = "BVDOutbreakSize-informed renewal model"
sampler = { num_chains = 2, num_warmup = 500, num_samples = 750, target_accept = 0.95, max_tree_depth = 10, seed = 1, chain_method = "parallel" }

[[candidates]]
id = "renewalsp"
kind = "fallback"
config = "renewalsp"
model = "renewalsp"
stage = "primary"
label = "single-patch province renewal models"
sampler = { num_chains = 2, num_warmup = 500, num_samples = 750, target_accept = 0.9, max_tree_depth = 10, seed = 1, chain_method = "parallel" }

[[candidates]]
id = "main"
kind = "fallback"
config = "main"
model = "renewal"
stage = "primary"
label = "province renewal model"
sampler = { num_chains = 2, num_warmup = 500, num_samples = 750, target_accept = 0.9, max_tree_depth = 10, seed = 1, chain_method = "parallel" }

# Random walk on a nowcast (no MCMC). Like random walk it needs no fit and
# is built in `prepare`.
[[candidates]]
id = "randomwalknowcast"
kind = "randomwalk"
config = "randomwalknowcast"
model = "randomwalknowcast"
stage = "baseline"
label = "random walk on a nowcast"

[[candidates]]
id = "randomwalk"
kind = "randomwalk"
config = "randomwalk"
stage = "baseline"
label = "random walk baseline"

# Fine-tuned Chronos-2, the hub model seabbs-chronos2_ft (config/hub.toml)
# of its own. Each runs in its own job with no fit (`direct`), checked
# against the random walk, and is never in another model's chain.
[[candidates]]
id = "chronos2_ft_daily"
kind = "direct"
config = "fm_chronos_daily_ragged_ft"
model = "fm_chronos_daily_ragged_ft"
stage = "baseline"
label = "fine-tuned Chronos-2 on the daily releases"

[[candidates]]
id = "chronos2_ft_weekly"
kind = "direct"
config = "fm_chronos_weekly_ragged_ft"
model = "fm_chronos_weekly_ragged_ft"
stage = "baseline"
label = "fine-tuned Chronos-2 on the weekly releases"

# Convergence thresholds, the same for every candidate. Past `fail`
# (BVDOutbreakSize's failure threshold, docs/fits/convergence.jl) a fit
# is ruled out and the chain moves on; past `warn` it is reported only.
# A value strictly past a threshold breaches it.
[convergence.fail]
rhat = 1.1
ess_bulk = 25
ess_tail = 25
divergent_fraction = 0.05

[convergence.warn]
rhat = 1.05
ess_bulk = 100
ess_tail = 100
divergent_fraction = 0.01

# Posterior predictive checks on the fit's ppc.json (check_ppc.py).
# Coverage is the share of observed counts inside the predictive
# interval of `level`, for `stream`, over every in-sample week and over
# the last `recent_weeks` complete weeks. A model with no posterior is
# n/a.
# Posterior predictive checks: reported only, never gated. Below
# `coverage_warn` the PR warns; below `coverage_fail` it calls the
# coverage poor. Model choice comes from the backtest.
[ppc]
stream = "total"
level = 0.9
coverage_warn = 0.70
coverage_fail = 0.50
recent_weeks = 4
# Kolmogorov-Smirnov distance of the randomised PIT from uniform. It
# only warns, and only with enough rows to say anything.
pit_ks_warn = 0.2
pit_min_rows = 20

# Plausibility and consistency checks on the forecast file. Ratios are
# symmetric: a ratio r is breached when the value is above r times or
# below 1/r times the reference.
# The format checks (schema, values, samples), the national sum and
# `plausible` fail; the other checks only warn.
[checks]
samples = 100
horizon_weeks = 3          # target end dates required after the reference date
nowcast_weeks = 4          # back weeks required up to the reference date
# National must be the sum of the provinces plus the unassigned
# component in national.json.
sum_tolerance = 1e-9       # absolute (or 1e-12 relative)
# Plausibility, which rules a candidate out. For each location with data,
# against the largest of its last `plausible_recent_weeks` observed weeks
# (floored at `plausible_floor`), every week from the nowcast to the last
# horizon must have a median under `plausible_median_ratio` times it and a
# 97.5% quantile under `plausible_q975_ratio` times it, and, where that
# maximum is at least the floor, a median above it over
# `plausible_low_ratio`.
plausible_recent_weeks = 4
plausible_floor = 20
plausible_median_ratio = 5.0
plausible_q975_ratio = 15.0
plausible_low_ratio = 20.0
# Upper bound on any trajectory: the 95th centile of a week, relative to
# the largest weekly count the location has ever had (floored).
bound_floor = 20
bound_warn = 5
# Week-on-week growth of the median trajectory over the forecast weeks.
growth_warn = 2.0
# Median of the submitted back weeks against the observed counts in the
# last complete weeks (weeks ending at least `complete_lag_weeks` before
# the data vintage). Counts are offset by `ratio_offset` first.
complete_lag_weeks = 4
complete_weeks = 2
ratio_offset = 5
observed_warn = 2.0
# Median of the forecast weeks against the random walk baseline. A
# departure is flagged, never failed.
baseline_warn = 3.0
# Median of the weeks shared with last week's submission. Revisions are
# expected, so this only warns.
previous_warn = 2.0
