site_name: bdbv-hub-modelling
site_description: >-
  Nowcasts and forecasts of confirmed Bundibugyo virus disease cases for the
  BDBV Modeling Hub, from baselinenowcast with a random walk, with renewal
  model candidates, data tools and a backtest.
site_author: Sam Abbott
site_url: https://samabbott.co.uk/bdbv-hub-modelling/
repo_url: https://github.com/seabbs/bdbv-hub-modelling
repo_name: seabbs/bdbv-hub-modelling
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sam Abbott. MIT licence.

docs_dir: docs
site_dir: _site
hooks:
  - scripts/cache_bust.py

exclude_docs: |
  generated/*
  examples/*

nav:
  - Home: index.md
  - Fine-tuned foundation:
      - foundation/index.md
      - Paper: paper.md
      - Using the fine-tuned model: methods/finetuned-chronos.md
      - German nowcast benchmark: germany.md
  - Joint-model-informed renewal:
      - renewal/index.md
      - Methods: renewal/methods.md
      - Methods reference: methods/model.md
      - Implementation: methods/implementation.md
  - Hub submission:
      - hub/index.md
      - Nowcast: nowcast.md
      - Backtest: backtest.md
      - Comparison with hub forecasts: comparison.md
      - Data:
          - Hub data: data.md
          - Data methods: methods/data.md
      - Methods:
          - Foundation models: methods/foundation.md
          - Baseline models: methods/baselines.md
          - Evaluation: methods/evaluation.md
          - Pairing sensitivity: pairing.md
      - Submission:
          - Workflow: submission/workflow.md
          - Hub specification: submission/hub-spec.md
          - Opting in: submission/opting-in.md
          - Submission log: submission/rounds/index.md
  - Packages:
      - packages/index.md
      - Setup: setup.md
      - Getting started: getting-started.ipynb
      - Development:
          - Contributing: development/contributing.md
          - Adding a model: development/adding-a-model.md
          - CLI: development/cli.md
      - API reference:
          - reference/index.md
          - Data: reference/data.md
          - Models:
              - Forecasters: reference/forecasters.md
              - Renewal model: reference/model.md
              - Baselinenowcast: reference/baselinenowcast.md
          - Evaluation: reference/evaluation.md
          - Reporting:
              - Figures and tables: reference/reporting.md
              - Submission: reference/submission.md
          - CLI: reference/cli.md
      - Citation and licence: citation.md

theme:
  name: material
  language: en
  logo: assets/logo-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/seabbs/bdbv-hub-modelling
      name: Source on GitHub
    - icon: material/bug-outline
      link: https://github.com/seabbs/bdbv-hub-modelling/issues
      name: Issue tracker

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/toggles.js
  - javascripts/placemap.js
  - javascripts/zoom.js
  - javascripts/summarise.js
  - javascripts/energy.js
  - javascripts/tablesort.js
  - javascripts/tablefilter.js
  - javascripts/explorer.js
  - javascripts/scorechart.js
  - javascripts/scoresummary.js
  - javascripts/checkschart.js
  - javascripts/nowcastchart.js
  - javascripts/zonereview.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/generated, docs/examples]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Pages that moved or were removed, so their old addresses still work.
  - redirects:
      redirect_maps:
        model-development/model-building.md: renewal/methods.md
        model-development/log.md: renewal/index.md
        model-development/score-history.md: backtest.md
  - mkdocs-jupyter:
      # Only the executed notebook. The .py source would also render to
      # getting-started/ and replace it with a page without outputs.
      include: ["*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]
