site_name: BDBVHubRenewal
site_description: >-
  Renewal-model nowcasts and forecasts of confirmed Bundibugyo virus disease
  cases for the BDBV Modeling Hub, with data tools and a backtest.
site_author: Sam Abbott
site_url: https://samabbott.co.uk/BDBVHubRenewal/
repo_url: https://github.com/seabbs/BDBVHubRenewal
repo_name: seabbs/BDBVHubRenewal
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sam Abbott. MIT licence.

docs_dir: docs
site_dir: _site

exclude_docs: |
  generated/*
  examples/*

nav:
  - Home: index.md
  - Getting started: getting-started.ipynb
  - Methods:
      - Data: methods/data.md
      - Model: methods/model.md
      - Evaluation: methods/evaluation.md
      - Implementation: methods/implementation.md
  - Data: data.md
  - Backtest: backtest.md
  - Held-out evaluation: heldout.md
  - Comparison with hub forecasts: comparison.md
  - Nowcast: nowcast.md
  - Submission:
      - Rounds: submission/rounds/index.md
      - Opting in: submission/opting-in.md
      - Workflow: submission/workflow.md
      - Hub specification: submission/hub-spec.md
  - Model development:
      - Model building: model-development/model-building.md
      - Development log: model-development/log.md
  - Development:
      - Contributing: development/contributing.md
      - Adding a model: development/adding-a-model.md
      - CLI: development/cli.md
  - API reference:
      - reference/index.md
      - Data: reference/data.md
      - Model: reference/model.md
      - Forecasters: reference/forecasters.md
      - Evaluation: reference/evaluation.md
      - Submission: reference/submission.md
      - Reporting: reference/reporting.md
  - Citation and licence: citation.md

theme:
  name: material
  language: en
  logo: assets/logo-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/seabbs/BDBVHubRenewal
      name: Source on GitHub
    - icon: material/bug-outline
      link: https://github.com/seabbs/BDBVHubRenewal/issues
      name: Issue tracker

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/generated, docs/examples]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]
