# The template every package's docs site inherits (`INHERIT:` in
# packages/<package>/mkdocs.yml): Getting started, How to, Reference and
# How it is used in the workflow. Each site is built on its own and
# published at <main site>/<package>/.
site_author: Sam Abbott
repo_url: https://github.com/seabbs/bdbv-hub-modelling
repo_name: seabbs/bdbv-hub-modelling
copyright: Copyright &copy; 2026 Sam Abbott. MIT licence.
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  homepage: https://samabbott.co.uk/bdbv-hub-modelling/
  social:
    - icon: material/home
      link: https://samabbott.co.uk/bdbv-hub-modelling/packages/
      name: All packages
    - icon: fontawesome/brands/github
      link: https://github.com/seabbs/bdbv-hub-modelling
      name: Source on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]
