[project]
name = "bdbvhub"
version = "0.1.0"
description = "Nowcasts and forecasts for the BDBV Modeling Hub: hub data, the model registry, the fit store, submission and reports"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sam Abbott", email = "sam.abbott@lshtm.ac.uk" }]
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "pyyaml>=6",
  "tabulate>=0.9",
  "tzdata>=2024.1",
  "jax>=0.12.0",
  "nowcastutils",
  "nowcasteval",
  "nowcastbaselines",
  "nowcastfoundation",
  "nowcastrenewal",
  "nowcastgermany",
]

[project.scripts]
bdbvhub = "bdbvhub.cli:main"
# The command's name before the packages split.
bdbvhubrenewal = "bdbvhub.cli:main"

[tool.uv.sources]
nowcastutils = { workspace = true }
nowcasteval = { workspace = true }
nowcastbaselines = { workspace = true }
nowcastfoundation = { workspace = true }
nowcastrenewal = { workspace = true }
nowcastgermany = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
