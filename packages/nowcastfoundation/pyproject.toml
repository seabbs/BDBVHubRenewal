[project]
name = "nowcastfoundation"
version = "0.1.0"
description = "Foundation-model nowcasts and forecasts: Chronos-2 forecasters, fine-tuning helpers and checkpoint scoring"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sam Abbott", email = "sam.abbott@lshtm.ac.uk" }]
requires-python = ">=3.13"
# Chronos-2, torch, peft and safetensors are imported by `forecaster`,
# `series_bias` and `checkpoint` but stay in the workspace's `chronos`
# dependency group, so the runtime export every fit key holds leaves them
# out.
dependencies = [
  "jax>=0.12.0",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "nowcastutils",
  "nowcasteval",
  "nowcastbaselines",
]

[tool.uv.sources]
nowcastutils = { workspace = true }
nowcasteval = { workspace = true }
nowcastbaselines = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
