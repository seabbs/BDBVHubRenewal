[project]
name = "nowcastutils"
version = "0.1.0"
description = "Shared pieces for nowcasting and forecasting: release dates, snapshot arrays, location hierarchies, the forecast task and model registry, and quantile-to-trajectory coupling"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sam Abbott", email = "sam.abbott@lshtm.ac.uk" }]
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "tzdata>=2024.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
