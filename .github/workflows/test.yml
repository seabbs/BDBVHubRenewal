name: Tests

on:
  schedule:
    # Weekly, Monday 05:00 UTC, with the slow parameter recovery fit.
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-forecast-env/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests and the smoke runs below read the frozen data in
    # tests/fixtures/data, never the live hub data.
    env:
      BDBV_DATA_DIR: tests/fixtures/data
      # The fixture's latest vintage. The nowcasts below forecast from it
      # and date their files by it, so the hub's check that the forecast
      # date is on or before the reference date holds whatever the day.
      VINTAGE: '2026-11-08'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv, the locked environment and the tests' own JAX cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: test
      - name: Tests
        run: >-
          uv run pytest -q --durations=50 --cov=bdbvhubrenewal
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: package
          use_oidc: true
          fail_ci_if_error: false
      # The recovery fit takes about 12 minutes, so it runs weekly and
      # on demand. The tiny fit below runs on every push.
      - name: Parameter recovery fit
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: uv run pytest -q -m slow --durations=0
      - name: Backtest and nowcast smoke test
        timeout-minutes: 15
        # The backtest never fits the fitted models (their forecasts come
        # from the fit store), so this runs random walk only.
        run: |
          uv run bdbvhubrenewal backtest --models randomwalk \
            --data "$BDBV_DATA_DIR" \
            --output output/backtest --results output/results
          uv run bdbvhubrenewal nowcast --vintage "$VINTAGE" \
            --forecast-date "$VINTAGE"
          uv run bdbvhubrenewal metadata --out output/metadata
      - name: Fit and forecast as the submission CI does (a tiny fit)
        run: |
          uv run bdbvhubrenewal --version
          uv run bdbvhubrenewal fit --model renewal --config main \
            --sampler-json '{"num_chains": 1, "num_warmup": 50, "num_samples": 50}' \
            --out output/fits/main
          uv run bdbvhubrenewal plot-ppc --ppc output/fits/main/ppc.json \
            --out output/fits/main/ppc.png
          uv run bdbvhubrenewal nowcast --config main --fit output/fits/main \
            --vintage "$VINTAGE" --forecast-date "$VINTAGE" \
            --out output/candidates/main
          uv run bdbvhubrenewal plot-submission --out output/candidates/main.png \
            --submission "$(ls output/candidates/main/model-output/*/*.csv)"
          uv run bdbvhubrenewal coherence
