name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Tests
        run: uv run pytest -q --cov=bdbv_forecasts --cov-report=term-missing
      - name: Backtest and nowcast smoke test
        run: |
          uv run bdbv-forecasts backtest --output output/backtest --results output/results
          uv run bdbv-forecasts nowcast
          uv run bdbv-forecasts metadata --out output/metadata
      - name: Fit and forecast as the submission CI does (stand-in configs)
        run: |
          uv run bdbv-forecasts --version
          uv run bdbv-forecasts fit --config main --out output/fits/main
          uv run bdbv-forecasts nowcast --config main --fit output/fits/main \
            --out output/candidates/main
          uv run bdbv-forecasts plot-submission --out output/candidates/main.png \
            --submission "$(ls output/candidates/main/model-output/*/*.csv)"
          uv run bdbv-forecasts coherence
