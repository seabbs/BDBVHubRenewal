name: Tests

on:
  schedule:
    # Weekly, Monday 05:00 UTC, so the slow model fit tests run even
    # when nothing is pushed.
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Tests
        run: >-
          uv run pytest -q --cov=bdbv_hub_renewal --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: package
          use_oidc: true
          fail_ci_if_error: false
      # Real model fits take minutes, so they run on main and weekly,
      # not on pull requests.
      - name: Model fit tests (tiny real fits)
        if: github.event_name != 'pull_request'
        run: uv run pytest -q -m slow
      - name: Backtest and nowcast smoke test
        # The renewal variants are fitted per vintage, so the smoke test
        # runs persistence only. The full backtest runs on archie.
        run: |
          uv run bdbv-hub-renewal backtest --models persistence --output output/backtest --results output/results
          uv run bdbv-hub-renewal nowcast
          uv run bdbv-hub-renewal metadata --out output/metadata
      - name: Fit and forecast as the submission CI does (a tiny fit)
        run: |
          uv run bdbv-hub-renewal --version
          uv run bdbv-hub-renewal fit --model hubrenewal --config main \
            --sampler-json '{"num_chains": 1, "num_warmup": 50, "num_samples": 50}' \
            --out output/fits/main
          uv run bdbv-hub-renewal plot-ppc --ppc output/fits/main/ppc.json \
            --out output/fits/main/ppc.png
          uv run bdbv-hub-renewal nowcast --config main --fit output/fits/main \
            --out output/candidates/main
          uv run bdbv-hub-renewal plot-submission --out output/candidates/main.png \
            --submission "$(ls output/candidates/main/model-output/*/*.csv)"
          uv run bdbv-hub-renewal coherence
