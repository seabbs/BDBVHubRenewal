name: Workflow

# The top-level Snakemake workflow (workflow/): its helpers' tests and a
# dry run of every target, against a temporary machine and no network.
# Simulation, fine-tuning, publishing and scoring never run on CI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workflow/**'
      - 'tests/workflow/**'
      - 'scripts/**'
      - 'Taskfile.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/workflow.yml'
  pull_request:
    paths:
      - 'workflow/**'
      - 'tests/workflow/**'
      - 'scripts/**'
      - 'Taskfile.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/workflow.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install the workflow's tools
        run: uv sync --frozen --group paper
      - name: Tests and dry runs of every target
        run: uv run --frozen --group paper pytest -q tests/workflow
