name: Paper tests

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'src/bdbvhubrenewal/evaluation/**'
      - 'src/bdbvhubrenewal/data/**'
      - 'config/germany.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/paper-tests.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'src/bdbvhubrenewal/evaluation/**'
      - 'src/bdbvhubrenewal/data/**'
      - 'config/germany.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/paper-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The paper's code, its tests and a dry run and dummy-data run of its
  # evaluation workflow (in the tests).
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: paper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --group paper
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run --group paper pytest -q tests
