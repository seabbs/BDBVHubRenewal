name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Ruff and mypy
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
