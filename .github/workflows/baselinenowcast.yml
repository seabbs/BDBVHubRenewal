name: baselinenowcast fixtures

# The Python nowcast is checked against fixtures generated by the R
# package baselinenowcast (tests/baselinenowcast/fixtures). This
# job regenerates them with the pinned package version and fails if
# they differ from the committed files, so the fixtures cannot drift
# from the reference implementation.

on:
  push:
    branches: [main]
    paths:
      - 'src/bdbvhubrenewal/forecasters/randomwalk.py'
      - 'src/bdbvhubrenewal/baselinenowcast/**'
      - 'scripts/baselinenowcast_fixtures.R'
      - 'scripts/snapshot_fixtures.R'
      - 'tests/baselinenowcast/fixtures/**'
      - '.github/workflows/baselinenowcast.yml'
  pull_request:
    paths:
      - 'src/bdbvhubrenewal/forecasters/randomwalk.py'
      - 'src/bdbvhubrenewal/baselinenowcast/**'
      - 'scripts/baselinenowcast_fixtures.R'
      - 'scripts/snapshot_fixtures.R'
      - 'tests/baselinenowcast/fixtures/**'
      - '.github/workflows/baselinenowcast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install baselinenowcast 0.2.2
        run: |
          install.packages("remotes")
          remotes::install_version(
            "baselinenowcast", version = "0.2.2",
            repos = "https://cloud.r-project.org"
          )
        shell: Rscript {0}
      - name: Regenerate fixtures
        run: |
          Rscript scripts/baselinenowcast_fixtures.R
          Rscript scripts/snapshot_fixtures.R
      - name: Fail if the fixtures changed
        run: |
          git diff --exit-code tests/data/baselinenowcast \
            tests/baselinenowcast/fixtures
