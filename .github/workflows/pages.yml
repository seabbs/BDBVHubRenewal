name: Pages

# Builds the site on pull requests, publishes it as a preview at
# pr-preview/pr-N/ and comments the link (pr-closed.yml removes
# it when the pull request closes). Builds and deploys the site from main.
# Both deploy to the gh-pages branch, which Pages serves.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'scripts/fit-store.sh'
      - 'scripts/results-release.sh'
      - 'scripts/score_history.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'scripts/fit-store.sh'
      - 'scripts/results-release.sh'
      - 'scripts/score_history.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  workflow_dispatch:

permissions:
  contents: read
  # To say on the pages whether a Fit store run is in progress.
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds; let deploys from main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest hub releases and the stored fits, once, so every job below
  # reads the same data even if a release lands while they run.
  prep:
    name: Hub data and stored fits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          save-jax: 'false'
      # The latest hub releases, as the Fit store workflow fits them.
      - name: Refresh the hub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhubrenewal data
          uv run bdbvhubrenewal bvd
      # Pages never fits a model. The fitted models' forecasts come from
      # the fit store (fit-store.yml), which reruns this build when it has
      # stored new fits. `load` writes them into results/ with a record of
      # the fits used, which each page with their results states.
      - name: Load the stored fits
        env:
          # The fine-tuned models list the releases for their checkpoint.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/fit-store.sh fetch output/fit-store
          uv run bdbvhubrenewal fit-store load --store output/fit-store
      # The store too, as the Getting started notebook reads a stored fit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs
          path: |
            data
            !data/raw
            results
            output/fit-store
          retention-days: 1

  # The forecasts of the backtests that fit no model, one job per model
  # and backtest (and per block of dates or origins for the slow ones).
  # None of their results are committed. Each job only forecasts
  # (`--forecast-only`) and caches its forecasts under a hash of that
  # model's own code and the data (`bdbvhubrenewal digest --model`: the
  # model's import closure without docstrings, which leaves out the other
  # models' modules, config/, data/ less the raw downloads, the locked
  # dependencies and its command). So a change to one model reruns only
  # that model's jobs. `build` scores every model together each run
  # (`bdbvhubrenewal score`), as the energy scores compare models on the
  # cells they share. The fitted models' forecasts come from the store.
  # `task results` runs the same backtests in one go; keep them in step.
  backtest:
    name: Forecast (${{ matrix.cell }})
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Half the 20 runners, briefly when cached, so other workflows and
      # pull requests still get runners.
      max-parallel: 10
      matrix:
        # Longest first, so the short ones fill in behind them.
        include:
          # The German benchmark reads none of the hub data, so its cells
          # run without the inputs and are keyed on its own code and
          # config/germany.toml, which pins its data. A nowcast date takes
          # about 1 to 3 minutes, so the 80 development dates run in blocks.
          - cell: germany-randomwalknowcast-0
            model: randomwalknowcast
            germany: true
            run: >-
              uv run bdbvhubrenewal germany-backtest --models randomwalknowcast
              --chunk 0/4 --out output/parts/germany
          - cell: germany-randomwalknowcast-1
            model: randomwalknowcast
            germany: true
            run: >-
              uv run bdbvhubrenewal germany-backtest --models randomwalknowcast
              --chunk 1/4 --out output/parts/germany
          - cell: germany-randomwalknowcast-2
            model: randomwalknowcast
            germany: true
            run: >-
              uv run bdbvhubrenewal germany-backtest --models randomwalknowcast
              --chunk 2/4 --out output/parts/germany
          - cell: germany-randomwalknowcast-3
            model: randomwalknowcast
            germany: true
            run: >-
              uv run bdbvhubrenewal germany-backtest --models randomwalknowcast
              --chunk 3/4 --out output/parts/germany
          - cell: germany-randomwalk-0
            model: randomwalk
            germany: true
            run: >-
              uv run bdbvhubrenewal germany-backtest --models randomwalk
              --chunk 0/2 --out output/parts/germany
          - cell: germany-randomwalk-1
            model: randomwalk
            germany: true
            run: >-
              uv run bdbvhubrenewal germany-backtest --models randomwalk
              --chunk 1/2 --out output/parts/germany
          - cell: recovery-randomwalknowcast-0
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --recovery-only --forecast-only
              --models randomwalknowcast --chunk 0/3
          - cell: recovery-randomwalknowcast-1
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --recovery-only --forecast-only
              --models randomwalknowcast --chunk 1/3
          - cell: recovery-randomwalknowcast-2
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --recovery-only --forecast-only
              --models randomwalknowcast --chunk 2/3
          - cell: scenario-randomwalknowcast-falling
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only --forecast-only
              --models randomwalknowcast --scenarios falling
          - cell: scenario-randomwalknowcast-flat
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only --forecast-only
              --models randomwalknowcast --scenarios flat
          - cell: scenario-randomwalknowcast-rising
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only --forecast-only
              --models randomwalknowcast --scenarios rising
          - cell: zones-pprandomwalknowcast-0
            model: pprandomwalknowcast
            run: >-
              uv run bdbvhubrenewal zone-backtest --forecast-only
              --models pprandomwalknowcast --chunk 0/2
          - cell: zones-pprandomwalknowcast-1
            model: pprandomwalknowcast
            run: >-
              uv run bdbvhubrenewal zone-backtest --forecast-only
              --models pprandomwalknowcast --chunk 1/2
          - cell: zones-randomwalknowcast
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal zone-backtest --forecast-only --models randomwalknowcast
          - cell: zones-randomwalk
            model: randomwalk
            run: >-
              uv run bdbvhubrenewal zone-backtest --forecast-only --models randomwalk
          - cell: scenario-randomwalk-falling
            model: randomwalk
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only --forecast-only
              --models randomwalk --scenarios falling
          - cell: scenario-randomwalk-flat
            model: randomwalk
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only --forecast-only
              --models randomwalk --scenarios flat
          - cell: scenario-randomwalk-rising
            model: randomwalk
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only --forecast-only
              --models randomwalk --scenarios rising
          - cell: recovery-randomwalk
            model: randomwalk
            run: >-
              uv run bdbvhubrenewal backtest --recovery-only --forecast-only --models randomwalk
          - cell: development-randomwalknowcast
            model: randomwalknowcast
            run: >-
              uv run bdbvhubrenewal backtest --forecast-only --models randomwalknowcast
          - cell: development-randomwalk
            model: randomwalk
            run: >-
              uv run bdbvhubrenewal backtest --forecast-only --models randomwalk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One JAX cache per model: its programs are much the same in every
      # backtest. The first of its jobs to finish saves it.
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: pages-${{ matrix.model }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !matrix.germany }}
        with:
          name: inputs
      - name: Hash what this job reads
        id: key
        env:
          CELL: ${{ matrix.cell }}
          MODEL: ${{ matrix.model }}
          RUN: ${{ matrix.run }}
          WITH: >-
            ${{ matrix.germany && 'src/bdbvhubrenewal/data/germany.py
            src/bdbvhubrenewal/evaluation/germany.py
            src/bdbvhubrenewal/evaluation/backtest.py
            src/bdbvhubrenewal/evaluation/nowcast.py
            src/bdbvhubrenewal/evaluation/scoring.py
            src/bdbvhubrenewal/reporting/hubtables.py' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          digest=$(uv run bdbvhubrenewal digest --model "$MODEL" --text "$RUN" \
            --with $WITH)
          if [ -z "$digest" ]; then
            echo "::error::digest printed nothing; refusing to key the cache"
            exit 1
          fi
          echo "key=forecast-$CELL-$digest" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps, so outputs are saved as soon
      # as the run ends and a hit saves nothing.
      - name: Restore the outputs
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/parts
          key: ${{ steps.key.outputs.key }}
      - name: Fetch the German benchmark data
        if: matrix.germany && steps.cache.outputs.cache-hit != 'true'
        run: uv run bdbvhubrenewal germany-fetch
      - name: Run
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ matrix.run }}
      - name: Save the outputs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/parts
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # A hit runs nothing, so say so rather than leave the job blank.
      - name: Note the cached outputs
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          CELL: ${{ matrix.cell }}
        run: |
          echo "### Forecasts \`$CELL\`: cache hit, not rerun" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts-${{ matrix.cell }}
          path: output/parts
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prep, backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv and its cache, and JAX's persistent compilation cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
          jax-scope: pages-report
      - run: uv sync --frozen --all-groups
      # Pages for the submitted rounds come from the ledger branch that
      # the submission workflow writes. A merged round's page is frozen in
      # its `pages/` and copied as it is.
      - name: Fetch the submission ledger
        run: |
          mkdir -p output/ledger
          if git fetch -q --depth 1 origin submission-ledger; then
            git archive FETCH_HEAD | tar -x -C output/ledger
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      # The backtest job's files are its own, so they are copied in. The
      # blocks write the same files, so those are stacked.
      - name: Gather the forecasts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parts-*
          path: output/parts
      # Every model scored together, in the order one run takes them, with
      # the stored models' forecasts, as one run of each backtest would.
      - name: Score the backtests
        run: |
          p=output/parts/parts
          uv run bdbvhubrenewal score \
            "$p"-development-{randomwalk,randomwalknowcast} \
            "$p"-recovery-randomwalk "$p"-recovery-randomwalknowcast-{0,1,2} \
            "$p"-zones-{randomwalk,randomwalknowcast} \
            "$p"-zones-pprandomwalknowcast-{0,1} \
            "$p"-scenario-{randomwalk,randomwalknowcast}-{falling,flat,rising}
      - name: Compare with hub forecasts, then the docs figures and tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FIT_STORE_RUN=$(gh run list -R "$GITHUB_REPOSITORY" \
            -w fit-store.yml -b main -s in_progress -L 1 \
            --json url -q '.[0].url // ""')
          export FIT_STORE_RUN
          uv run bdbvhubrenewal compare-hub --fetch
          # The German blocks' samples are paired and scored together, so
          # each date's copula sees every earlier date. The hub teams'
          # nowcasts are read, not run, so they are scored here too.
          uv run bdbvhubrenewal germany-fetch
          uv run bdbvhubrenewal germany-score --out results/germany \
            output/parts/parts-germany-*/germany
          uv run bdbvhubrenewal germany-teams --out results/germany
          uv run bdbvhubrenewal germany-asof --out results/germany
          uv run bdbvhubrenewal germany-paper --results results/germany
          uv run bdbvhubrenewal report --ledger output/ledger
      # Scores at each deploy from main, read from the gh-pages branch,
      # with this build's scores last. Only the trees are fetched, and the
      # few distinct summaries as they are read. Without the branch the
      # page says the history is unavailable.
      - name: Score history
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch -q --filter=blob:none --no-tags origin \
            +gh-pages:refs/remotes/origin/gh-pages \
            || echo "::warning::gh-pages could not be fetched"
          uv run python scripts/score_history.py --ref origin/gh-pages \
            --docs docs/generated --figures docs/figures \
            --current docs/figures --current-sha "$SHA" \
            --out output/score-history.csv
      - name: Check hub teams are shown on the comparison page only
        run: |
          bad=0
          while read -r name; do
            if grep -q -e OHTJHU -e Chromantis "docs/generated/$name"; then
              echo "::error::docs/generated/$name names a hub team"
              bad=1
            fi
          done < <(grep -o -- '--8<-- "[^"]*"' docs/backtest.md | cut -d'"' -f2)
          exit "$bad"
      # As `task getting-started`. The notebook and its figures are built
      # here, not committed. The filter keeps a tqdm notice about
      # ipywidgets out of the published outputs.
      - name: Run the Getting started notebook
        env:
          PYTHONWARNINGS: 'ignore:IProgress not found'
        run: >-
          uv run --group docs jupytext --to ipynb --execute --run-path .
          docs/getting-started.py
      # A pull request from a submit-* branch: a dry run of the
      # seabbs-chronos2_ft track for the latest data, as the submission
      # workflow's prepare and chronos jobs run it (DRY_RUN, read-only
      # workflow token, nothing pushed), rendered as the preview's
      # submission/review/ page.
      - name: Detect the round to review
        id: round
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'submit-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"schema_version": 1, "rounds": {}}' > "$RUNNER_TEMP/state.json"
          uv run --project ci detect-new-vintage detect \
            --state "$RUNNER_TEMP/state.json" \
            --hub InsightNet-US/BDBV-Modeling-Hub --force --ignore-window
      - name: Read the hub's config at that commit
        if: steps.round.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InsightNet-US/BDBV-Modeling-Hub
          ref: ${{ steps.round.outputs.hub_ref }}
          path: output/hub-clone
          persist-credentials: false
          sparse-checkout: |
            hub-config
            model-metadata
      - name: Dry-run the seabbs-chronos2_ft track
        id: review
        if: steps.round.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
          CI_DIR: ci
          WORK: output/ci
          HUB_REF: ${{ steps.round.outputs.hub_ref }}
          AS_OF: ${{ steps.round.outputs.as_of }}
          REFERENCE_DATE: ${{ steps.round.outputs.reference_date }}
          DATA_COMMIT: ${{ steps.round.outputs.data_commit }}
          SOURCE_SHA: ${{ github.sha }}
          HUB_PATH: output/hub-clone
          VALIDATE: 'true'
          R_VALIDATION: 'false'
          CHECK_WINDOW: 'false'
          EXPECTED_LOCATIONS: ${{ vars.EXPECTED_LOCATIONS }}
        run: |
          # Until the hub opens the detected round, review the newest round
          # its tasks.json has, so the file is checked against a round. With
          # no round on or before it, the detected round is kept.
          REFERENCE_DATE=$(python3 - "$REFERENCE_DATE" << 'PY'
          import json, sys
          want = sys.argv[1]
          def dates(o):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k == "reference_date" and isinstance(v, dict):
                          yield from (v.get("required") or []) + (v.get("optional") or [])
                      else:
                          yield from dates(v)
              elif isinstance(o, list):
                  for x in o:
                      yield from dates(x)
          have = set(dates(json.load(open("output/hub-clone/hub-config/tasks.json"))))
          print(want if want in have else max((d for d in have if d <= want), default=want))
          PY
          )
          export REFERENCE_DATE
          echo "reference_date=$REFERENCE_DATE" >> "$GITHUB_OUTPUT"
          # A past round's file is dated on its reference date.
          if [ "$REFERENCE_DATE" != "${{ steps.round.outputs.reference_date }}" ]; then
            export HUB_FORECAST_DATE=$REFERENCE_DATE
          fi
          ci/steps/prepare.sh
          TRACK_MODEL=$(uv run python -c 'import tomllib
          m = tomllib.load(open("config/hub.toml", "rb"))["models"]
          print(next(k for k, v in m.items() if v["model_abbr"] == "chronos2_ft"))')
          # The other Chronos-2 source's model, to show beside it.
          OTHER=fm_chronos_weekly_ragged_ft
          [ "$TRACK_MODEL" = "$OTHER" ] && OTHER=fm_chronos_daily_ragged_ft
          echo "other=$OTHER" >> "$GITHUB_OUTPUT"
          # The copula pairs each model's draws using its fits at past
          # origins: fit any the store lacks into this job's copy of it.
          uv run bdbvhubrenewal fit-store plan --store output/fit-store \
            --models "$TRACK_MODEL" "$OTHER" --out "$RUNNER_TEMP/plan.json"
          jq -r '.include[] | "\(.model) \(.origin)"' "$RUNNER_TEMP/plan.json" \
            | while read -r m o; do
                uv run bdbvhubrenewal fit-store fit --model "$m" --origin "$o" \
                  --store output/fit-store || true
              done
          start=$SECONDS
          status=0
          set -o pipefail
          TRACK_MODEL=$TRACK_MODEL ci/steps/track.sh 2>&1 \
            | tee "$RUNNER_TEMP/track.log" || status=$?
          echo "track.sh exited $status"
          fdate=()
          [ -n "${HUB_FORECAST_DATE:-}" ] && fdate=(--forecast-date "$HUB_FORECAST_DATE")
          BDBV_DATA_DIR=output/ci/inputs/data uv run bdbvhubrenewal nowcast \
            --model "$OTHER" --vintage "$AS_OF" --reference-date "$REFERENCE_DATE" \
            --store output/fit-store \
            --history "output/ci/track-$TRACK_MODEL/ledger-archive/archive" \
            "${fdate[@]}" --out "$RUNNER_TEMP/other" || true
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          echo "model=$TRACK_MODEL" >> "$GITHUB_OUTPUT"
          # The latest seabbs-renewal file on the hub, to show beside it.
          # Without one the page leaves it out, so a failure here is not
          # fatal.
          prev=$(gh api "repos/InsightNet-US/BDBV-Modeling-Hub/contents/model-output/seabbs-renewal" \
            --jq '[.[] | select(.name | endswith(".csv")) | .name] | sort | last // empty' \
            || true)
          if [ -n "$prev" ]; then
            curl -fsSL "https://raw.githubusercontent.com/InsightNet-US/BDBV-Modeling-Hub/main/model-output/seabbs-renewal/$prev" \
              -o "$RUNNER_TEMP/seabbs-renewal.csv" \
              || rm -f "$RUNNER_TEMP/seabbs-renewal.csv"
          fi
      - name: Write the submission review page
        if: steps.review.outcome == 'success'
        env:
          MODEL: ${{ steps.review.outputs.model }}
          OTHER: ${{ steps.review.outputs.other }}
          SECONDS_TAKEN: ${{ steps.review.outputs.seconds }}
        run: |
          uv run python scripts/submission_review.py \
            --track "output/ci/track-$MODEL" \
            --observed output/ci/inputs/time-series.csv \
            --compare randomwalknowcast=output/ci/candidates/randomwalknowcast/submission \
            --compare "$OTHER=$RUNNER_TEMP/other" \
            --compare "seabbs-renewal (submitted)=$RUNNER_TEMP/seabbs-renewal.csv" \
            --table "Release backtest against randomwalknowcast, rolling truth, checkpoint r1 2c2b22a03107 (evidence/fm-chronos)=ci/review-tables/rolling.csv" \
            --seconds "$SECONDS_TAKEN" --log "$RUNNER_TEMP/track.log" \
            --out docs/submission/review
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
      # The results and data the `release` job may attach, and on a pull
      # request for comparing its results with main's.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: |
            results
            data
            !data/raw
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      # Pages serves the branch as it is, without Jekyll. Only the root
      # needs this: a preview's copy would survive its removal.
      - run: touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  # Only for branches of this repository: a fork's token cannot write, and
  # it never gets secrets.
  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: preview-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # Attaches every model's results to the round releases that used this
  # build's hub release (scripts/results-release.sh). Apart from the
  # deploy, so a failure here never holds the site back. Runs no project
  # code. Adding files to an existing release needs no tag, so the
  # workflow token can do it.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/results-release.sh attach build _site
