name: Pages

# Builds the site on pull requests, publishes it as a preview at
# pr-preview/pr-N/ and comments the link (pr-closed.yml removes
# it when the pull request closes). Builds and deploys the site from main.
# Both deploy to the gh-pages branch, which Pages serves.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'scripts/fit-store.sh'
      - 'scripts/results-release.sh'
      - 'scripts/score_history.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'scripts/fit-store.sh'
      - 'scripts/results-release.sh'
      - 'scripts/score_history.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  workflow_dispatch:

permissions:
  contents: read
  # To say on the pages whether a Fit store run is in progress.
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds; let deploys from main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest hub releases and the stored fits, once, so every job below
  # reads the same data even if a release lands while they run.
  prep:
    name: Hub data and stored fits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          save-jax: 'false'
      # The latest hub releases, as the Fit store workflow fits them.
      - name: Refresh the hub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhubrenewal data
          uv run bdbvhubrenewal bvd
      # Pages never fits a model. The fitted models' forecasts come from
      # the fit store (fit-store.yml), which reruns this build when it has
      # stored new fits. `load` writes them into results/ with a record of
      # the fits used, which each page with their results states.
      - name: Load the stored fits
        run: |
          scripts/fit-store.sh fetch output/fit-store
          uv run bdbvhubrenewal fit-store load --store output/fit-store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs
          path: |
            data
            !data/raw
            results
          retention-days: 1

  # The backtests that fit no model, one job each. None of their results
  # are committed. The backtest runs only the models with no fit, keeps
  # the stored rows and scores them again against the latest vintage. The
  # zone and scenario backtests run the random walks only, a scenario per
  # job. Each job's outputs are cached under a hash of what it reads
  # (`bdbvhubrenewal digest`: the package without report-only modules or
  # docstrings, config/, data/ less the raw downloads, the locked
  # dependencies and its commands, and for the backtest the loaded fits
  # in results/), so a job whose inputs did not change only restores.
  # `task results` runs the same commands locally; keep the two in step.
  backtest:
    name: Backtest (${{ matrix.cell }})
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Every job at once: at most five of the 20 runners, briefly when
      # cached, so other workflows still get runners.
      max-parallel: 5
      matrix:
        include:
          - cell: backtest
            reads: results
            run: |
              uv run bdbvhubrenewal backtest
              uv run bdbvhubrenewal backtest --evaluate-holdout
            writes: |
              results/backtest-fits.csv
              results/delay-summary.csv
              results/forecasts.csv.gz
              results/heldout-*
              results/nowcast-*
              results/recovery-*
          - cell: zones
            run: uv run bdbvhubrenewal zone-backtest
            writes: results/zone-*
          - cell: scenario-falling
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only
              --scenarios falling
            writes: results/scenario-*
          - cell: scenario-flat
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only
              --scenarios flat
            writes: results/scenario-*
          - cell: scenario-rising
            run: >-
              uv run bdbvhubrenewal backtest --scenarios-only
              --scenarios rising
            writes: results/scenario-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each job keeps its own JAX cache: the programs differ by job.
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: pages-${{ matrix.cell }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      - name: Hash what this job reads
        id: key
        env:
          CELL: ${{ matrix.cell }}
          READS: ${{ matrix.reads }}
          RUN: ${{ matrix.run }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          digest=$(uv run bdbvhubrenewal digest --with $READS --text "$RUN")
          if [ -z "$digest" ]; then
            echo "::error::digest printed nothing; refusing to key the cache"
            exit 1
          fi
          echo "key=backtest-$CELL-$digest" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps, so outputs are saved as soon
      # as the run ends and a hit saves nothing.
      - name: Restore the outputs
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.writes }}
          key: ${{ steps.key.outputs.key }}
      - name: Run
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ matrix.run }}
      - name: Save the outputs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.writes }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # A hit runs nothing, so say so rather than leave the job blank.
      - name: Note the cached outputs
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          CELL: ${{ matrix.cell }}
        run: |
          echo "### Backtest \`$CELL\`: cache hit, not rerun" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backtest-${{ matrix.cell }}
          path: ${{ matrix.writes }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prep, backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv and its cache, and JAX's persistent compilation cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
          jax-scope: pages-report
      - run: uv sync --frozen --all-groups
      # Pages for the submitted rounds come from the ledger branch that
      # the submission workflow writes. A merged round's page is frozen in
      # its `pages/` and copied as it is.
      - name: Fetch the submission ledger
        run: |
          mkdir -p output/ledger
          if git fetch -q --depth 1 origin submission-ledger; then
            git archive FETCH_HEAD | tar -x -C output/ledger
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      # The backtest and zone jobs write their own files, so they are
      # copied in. Every scenario job writes every scenario file, so those
      # are stacked in the order the scenarios ran in one run.
      - name: Gather the backtest outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backtest-*
          path: output/backtest
      - run: |
          cp output/backtest/backtest-backtest/* output/backtest/backtest-zones/* \
            results/
          uv run bdbvhubrenewal concat-results --out results \
            output/backtest/backtest-scenario-{falling,flat,rising}
      - name: Compare with hub forecasts, then the docs figures and tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FIT_STORE_RUN=$(gh run list -R "$GITHUB_REPOSITORY" \
            -w fit-store.yml -b main -s in_progress -L 1 \
            --json url -q '.[0].url // ""')
          export FIT_STORE_RUN
          uv run bdbvhubrenewal compare-hub --fetch
          uv run bdbvhubrenewal report --ledger output/ledger
      # Scores at each deploy from main, read from the gh-pages branch,
      # with this build's scores last. Only the trees are fetched, and the
      # few distinct summaries as they are read. Without the branch the
      # page says the history is unavailable.
      - name: Score history
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch -q --filter=blob:none --no-tags origin \
            +gh-pages:refs/remotes/origin/gh-pages \
            || echo "::warning::gh-pages could not be fetched"
          uv run python scripts/score_history.py --ref origin/gh-pages \
            --docs docs/generated --figures docs/figures \
            --current docs/figures --current-sha "$SHA" \
            --out output/score-history.csv
      - name: Check hub teams are shown on the comparison page only
        run: |
          bad=0
          while read -r name; do
            if grep -q -e OHTJHU -e Chromantis "docs/generated/$name"; then
              echo "::error::docs/generated/$name names a hub team"
              bad=1
            fi
          done < <(grep -o -- '--8<-- "[^"]*"' docs/backtest.md | cut -d'"' -f2)
          exit "$bad"
      # As `task getting-started`. The notebook and its figures are built
      # here, not committed. The filter keeps a tqdm notice about
      # ipywidgets out of the published outputs.
      - name: Run the Getting started notebook
        env:
          PYTHONWARNINGS: 'ignore:IProgress not found'
        run: >-
          uv run --group docs jupytext --to ipynb --execute --run-path .
          docs/getting-started.py
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
      # The results and data the `release` job may attach, and on a pull
      # request for comparing its results with main's.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: |
            results
            data
            !data/raw
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      # Pages serves the branch as it is, without Jekyll. Only the root
      # needs this: a preview's copy would survive its removal.
      - run: touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  # Only for branches of this repository: a fork's token cannot write, and
  # it never gets secrets.
  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: preview-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # Attaches every model's results to the round releases that used this
  # build's hub release (scripts/results-release.sh). Apart from the
  # deploy, so a failure here never holds the site back. Runs no project
  # code. Adding files to an existing release needs no tag, so the
  # workflow token can do it.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/results-release.sh attach build _site
