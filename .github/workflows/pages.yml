name: Pages

# Builds the site on pull requests, publishes it as a preview at
# pr-preview/pr-N/ and comments the link (pr-preview-cleanup.yml removes
# it when the pull request closes). Builds and deploys the site from main.
# Both deploy to the gh-pages branch, which Pages serves.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'scripts/fit-store.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'scripts/fit-store.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds; let deploys from main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv and its cache, and JAX's persistent compilation cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
      - run: uv sync --frozen --all-groups
      # Pages for the submitted rounds come from the ledger branch that
      # the submission workflow writes. A merged round's page is frozen in
      # its `pages/` and copied as it is.
      - name: Fetch the submission ledger
        run: |
          mkdir -p output/ledger
          if git fetch -q --depth 1 origin submission-ledger; then
            git archive FETCH_HEAD | tar -x -C output/ledger
          fi
      # The latest hub releases, as the Fit store workflow fits them.
      - name: Refresh the hub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhubrenewal data
          uv run bdbvhubrenewal bvd
      # Pages never fits a model. The fitted models' forecasts come from
      # the fit store (fit-store.yml), which reruns this build when it has
      # stored new fits. `load` writes them into results/ with a record of
      # the fits used, which each page with their results states.
      - name: Load the stored fits
        run: |
          scripts/fit-store.sh fetch output/fit-store
          uv run bdbvhubrenewal fit-store load --store output/fit-store
      # The backtest runs only the models with no fit, keeps the stored
      # rows and scores them again against the latest vintage.
      # It reads only these inputs, so an unchanged hash reuses its outputs.
      - name: Restore the backtest outputs
        id: backtest
        uses: actions/cache@v6
        with:
          path: |
            results
            output
          key: backtest-${{ hashFiles('src/**', 'config/**', 'data/**', 'results/**', 'uv.lock') }}
      - name: Backtest
        if: steps.backtest.outputs.cache-hit != 'true'
        run: |
          uv run bdbvhubrenewal backtest
          uv run bdbvhubrenewal backtest --evaluate-holdout
      - name: Compare with hub forecasts, then the docs figures and tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhubrenewal compare-hub --fetch
          uv run bdbvhubrenewal report --ledger output/ledger
      - name: Check hub teams are shown on the comparison page only
        run: |
          bad=0
          while read -r name; do
            if grep -q -e OHTJHU -e Chromantis "docs/generated/$name"; then
              echo "::error::docs/generated/$name names a hub team"
              bad=1
            fi
          done < <(grep -o -- '--8<-- "[^"]*"' docs/backtest.md | cut -d'"' -f2)
          exit "$bad"
      # As `task getting-started`. The notebook and its figures are built
      # here, not committed. The filter keeps a tqdm notice about
      # ipywidgets out of the published outputs.
      - name: Run the Getting started notebook
        env:
          PYTHONWARNINGS: 'ignore:IProgress not found'
        run: >-
          uv run --group docs jupytext --to ipynb --execute --run-path .
          docs/getting-started.py
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      # Pages serves the branch as it is, without Jekyll. Only the root
      # needs this: a preview's copy would survive its removal.
      - run: touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  # Only for branches of this repository: a fork's token cannot write, and
  # it never gets secrets.
  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: preview-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
