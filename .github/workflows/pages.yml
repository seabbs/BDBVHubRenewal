name: Pages

# Builds the site on pull requests as a check, and builds and deploys it
# from main.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds; let deploys from main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Pages for the submitted rounds come from the ledger branch that
      # the submission workflow's record job writes.
      - name: Fetch the submission ledger
        run: |
          mkdir -p output/ledger
          if git fetch -q --depth 1 origin submission-ledger; then
            git archive FETCH_HEAD | tar -x -C output/ledger
          fi
      # Pages never fits a model. The fitted renewal variants are run apart
      # (on archie) and their forecasts and scores committed in results/.
      # `--no-fit` runs only the models with no fit, keeps those rows, and
      # scores the committed held-out forecasts again against the latest
      # vintage, even for a chosen fitted model.
      - name: Backtest, then the docs figures and tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhubrenewal backtest --no-fit
          uv run bdbvhubrenewal backtest --evaluate-holdout --no-fit
          uv run bdbvhubrenewal compare-hub --fetch
          uv run bdbvhubrenewal report --ledger output/ledger
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
