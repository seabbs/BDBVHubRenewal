name: Pages

# Builds the site on pull requests, publishes it as a preview at
# pr-preview/pr-N/ and comments the link, and removes the preview when the
# pull request closes. Builds and deploys the site from main.
# Both deploy to the gh-pages branch, which Pages serves.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds; let deploys from main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv and its cache, and JAX's persistent compilation cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
      - run: uv sync --frozen --all-groups
      # Pages for the submitted rounds come from the ledger branch that
      # the submission workflow writes. A merged round's page is frozen in
      # its `pages/` and copied as it is.
      - name: Fetch the submission ledger
        run: |
          mkdir -p output/ledger
          if git fetch -q --depth 1 origin submission-ledger; then
            git archive FETCH_HEAD | tar -x -C output/ledger
          fi
      # Pages never fits a model. The fitted renewal variants are run apart
      # (on archie) and their forecasts and scores committed in results/.
      # `--no-fit` runs only the models with no fit, keeps those rows, and
      # scores the committed held-out forecasts again against the latest
      # vintage, even for a chosen fitted model.
      # The backtest reads only these inputs (the fitted variants' rows
      # come from results/), so an unchanged hash reuses its outputs.
      - name: Restore the backtest outputs
        id: backtest
        uses: actions/cache@v6
        with:
          path: |
            results
            output
          key: backtest-${{ hashFiles('src/**', 'config/**', 'data/**', 'results/**', 'uv.lock') }}
      - name: Backtest
        if: steps.backtest.outputs.cache-hit != 'true'
        run: |
          uv run bdbvhubrenewal backtest --no-fit
          uv run bdbvhubrenewal backtest --evaluate-holdout --no-fit
      - name: Compare with hub forecasts, then the docs figures and tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhubrenewal compare-hub --fetch
          uv run bdbvhubrenewal report --ledger output/ledger
      # As `task getting-started`. The notebook and its figures are built
      # here, not committed. The filter keeps a tqdm notice about
      # ipywidgets out of the published outputs.
      - name: Run the Getting started notebook
        env:
          PYTHONWARNINGS: 'ignore:IProgress not found'
        run: >-
          uv run --group docs jupytext --to ipynb --execute --run-path .
          docs/getting-started.py
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      # Pages serves the branch as it is, without Jekyll.
      - run: touch _site/.nojekyll
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  # Runs after a successful build, and on close (when build is skipped) to
  # remove the preview. Only for branches of this repository: a fork's
  # token cannot write, and it never gets secrets.
  preview:
    needs: build
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: preview-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: github.event.action != 'closed'
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
