name: Remove PR preview

# Removes a pull request's docs preview from gh-pages when it closes.
# pull_request_target runs even when the pull request has merge
# conflicts, which pull_request does not. It never checks out the pull
# request's code.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency: preview-refs/pull/${{ github.event.number }}/merge

jobs:
  remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
