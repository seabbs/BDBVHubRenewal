name: Fit candidates

# Reusable: forecast from and check the fitted candidates of the fallback
# chain, one matrix leg per candidate. Called by submit.yml for the
# primary stage, with every renewal candidate and shadow in parallel.
#
# Each leg reads the fit store's fit of the same code and data
# (`bdbvhubrenewal fit-store unpack`, keyed as fit-store.yml stores it),
# so the submitted forecast is the fit the docs and the backtest show.
# A candidate the store lacks is ruled out. Nothing is fitted here.

on:
  workflow_call:
    inputs:
      matrix:
        description: Matrix JSON from `submission_ci.policy` (an `include` list)
        type: string
        required: true
      reference_date:
        type: string
        required: true
      expected_locations:
        type: string
        default: ''
      store_branch:
        description: The fit store branch to read
        type: string
        default: fit-store

permissions:
  contents: read

env:
  CI_DIR: ci
  WORK: output/ci
  # The model and hub id come from the run's context.json, which
  # `prepare` resolves from config/hub.toml.
  # Every bdbvhubrenewal command reads the tidy data the prepare job
  # pinned to the hub commit, shipped in the `inputs` artefact.
  BDBV_DATA_DIR: output/ci/inputs/data
  BDBV_RAW_DIR: output/ci/raw

jobs:
  fit:
    name: Candidate ${{ matrix.id }}
    # Reading a stored fit needs no fitting runner.
    runs-on: ubuntu-latest
    # From the matrix: leaves the gate time before the window closes
    # (ci/policy.toml [timing]).
    timeout-minutes: ${{ fromJSON(matrix.timeout || '350') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
      - name: Collect the shared inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
          path: ${{ env.WORK }}
      # Random walk candidates read no fit, so they need no store.
      - name: Fetch the fit store
        if: matrix.kind != 'randomwalk'
        env:
          FIT_STORE_BRANCH: ${{ inputs.store_branch }}
        run: scripts/fit-store.sh fetch output/fit-store
      - name: Forecast and check ${{ matrix.id }}
        env:
          CAND_ID: ${{ matrix.id }}
          CAND_KIND: ${{ matrix.kind }}
          CAND_CONFIG: ${{ matrix.config }}
          CAND_LABEL: ${{ matrix.label }}
          CAND_MODEL: ${{ matrix.model }}
          CAND_SAMPLER: ${{ matrix.sampler }}
          FIT_SOURCE: store
          STORE: output/fit-store
          EXPECTED_LOCATIONS: ${{ inputs.expected_locations }}
        run: ci/steps/candidate.sh
      # The candidate's verdicts, file and plot: small, read by the gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-${{ matrix.id }}
          path: ${{ env.WORK }}/candidates/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 7
      # The fit directory, kept a few days for diagnosis, as
      # BVDOutbreakSize keeps its fit artefacts for three days. The
      # durable copy of a stored fit is on the fit-store branch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fit-${{ matrix.id }}
          path: ${{ env.WORK }}/fits/${{ matrix.id }}
          if-no-files-found: ignore
          retention-days: 3
