name: Fit candidates

# Reusable: fit and check the fitted candidates of the fallback chain,
# one matrix leg per candidate, as BVDOutbreakSize's docs.yml fits one
# model per matrix job. Called by submit.yml for the primary stage, with
# every renewal candidate and shadow in parallel.
#
# Each fit is content-addressed: the cache key hashes the model source,
# the hub data commit and the candidate's config and sampler settings
# (ci/policy.toml, `[cache] inputs`), so a re-run in the same window
# with nothing changed loads the fit rather than refitting.

on:
  workflow_call:
    inputs:
      matrix:
        description: Matrix JSON from `submission_ci.policy` (an `include` list)
        type: string
        required: true
      reference_date:
        type: string
        required: true
      expected_locations:
        type: string
        default: ''

permissions:
  contents: read

env:
  CI_DIR: ci
  WORK: output/ci
  # The model and hub id come from the run's context.json, which
  # `prepare` resolves from config/hub.toml.
  # Every bdbvhubrenewal command reads the tidy data the prepare job
  # pinned to the hub commit, shipped in the `inputs` artefact.
  BDBV_DATA_DIR: output/ci/inputs/data
  BDBV_RAW_DIR: output/ci/raw

jobs:
  fit:
    name: Fit ${{ matrix.id }}
    runs-on: ${{ vars.FIT_RUNNER || 'ubuntu-latest' }}
    # From the matrix: under GitHub's 360-minute cap for a hosted job, and
    # short enough to leave the gate time before the window closes
    # (ci/policy.toml [timing]). A fit that needs longer belongs on a
    # larger or self-hosted runner (FIT_RUNNER); see SETUP.md.
    timeout-minutes: ${{ fromJSON(matrix.timeout || '350') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
      - name: Collect the shared inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
          path: ${{ env.WORK }}
      # Restore and save are separate, as in BVDOutbreakSize, so the fit
      # is saved as soon as it ends even if a later step fails.
      - name: Restore the fit cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK }}/fits/${{ matrix.id }}
          key: fit-${{ matrix.id }}-${{ matrix.key }}
      - name: Fit, forecast and check ${{ matrix.id }}
        env:
          CAND_ID: ${{ matrix.id }}
          CAND_KIND: ${{ matrix.kind }}
          CAND_CONFIG: ${{ matrix.config }}
          CAND_LABEL: ${{ matrix.label }}
          CAND_MODEL: ${{ matrix.model }}
          CAND_SAMPLER: ${{ matrix.sampler }}
          FIT_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          EXPECTED_LOCATIONS: ${{ inputs.expected_locations }}
        run: ci/steps/candidate.sh
      - name: Save the fit cache
        if: >-
          ${{ always() && steps.cache.outputs.cache-hit != 'true' &&
          hashFiles(format('{0}/fits/{1}/diagnostics.json', env.WORK, matrix.id)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK }}/fits/${{ matrix.id }}
          key: fit-${{ matrix.id }}-${{ matrix.key }}
      # The candidate's verdicts, file and plot: small, read by the gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-${{ matrix.id }}
          path: ${{ env.WORK }}/candidates/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 7
      # The posterior itself, kept a few days for diagnosis, as
      # BVDOutbreakSize keeps its fit artefacts for three days. The
      # durable copy is the content-addressed cache above.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fit-${{ matrix.id }}
          path: ${{ env.WORK }}/fits/${{ matrix.id }}
          if-no-files-found: ignore
          retention-days: 3
