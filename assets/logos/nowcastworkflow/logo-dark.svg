<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 32" role="img">
  <title>nowcastworkflow (dark backgrounds)</title>
  <!-- Forecast fan: 90% band and median after the forecast date -->
  <path d="M17 12L30 2V22.5Z" fill="#0f8f84" fill-opacity="0.3"/>
  <path d="M17 12L29.5 10.5" fill="none" stroke="#0f8f84"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- Time axis and vertical "now" line -->
  <path stroke="#f0efec" d="M2.5 27.5H29.5M17 5V27.5" fill="none"
        stroke-width="1.6" stroke-linecap="round"/>
  <!-- Observed onsets rising to the forecast date -->
  <path d="M3 23.5C8.5 23.5 11 12.5 17 12" fill="none" stroke="#0f8f84"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- Latest observation -->
  <circle cx="17" cy="12" r="3" fill="#eb6834"/>
  <!-- Package: a box in the empty corner -->
  <rect x="3" y="3" width="6.5" height="6.5" rx="1.2" fill="none" stroke="#f0efec" stroke-width="1.4"/>
  <text x="40" y="22.5" fill="#f0efec"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.3"
        textLength="166" lengthAdjust="spacingAndGlyphs">nowcast<tspan
        fill="#0f8f84">workflow</tspan></text>
</svg>
