<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 32" role="img">
  <title>bdbv-hub-modelling (dark backgrounds)</title>
  <!-- Forecast fan: 90% band and median after the forecast date -->
  <path d="M17 12L30 2V22.5Z" fill="#2a78d6" fill-opacity="0.3"/>
  <path d="M17 12L29.5 10.5" fill="none" stroke="#2a78d6"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- Time axis and vertical "now" line -->
  <path stroke="#f0efec" d="M2.5 27.5H29.5M17 5V27.5" fill="none"
        stroke-width="1.6" stroke-linecap="round"/>
  <!-- Earlier releases: the same curve, shorter and lower (reporting delay) -->
  <path d="M3 23.5C6.5 23.5 8.5 22 11 21.8" fill="none" stroke="#2a78d6"
        stroke-opacity="0.4" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M3 23.5C7.5 23.5 10 19 14 18.6" fill="none" stroke="#2a78d6"
        stroke-opacity="0.65" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Observed onsets rising to the forecast date -->
  <path d="M3 23.5C8.5 23.5 11 12.5 17 12" fill="none" stroke="#2a78d6"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- Latest observation -->
  <circle cx="17" cy="12" r="3" fill="#eb6834"/>
  <text x="40" y="22.5" fill="#f0efec"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.3"
        textLength="200" lengthAdjust="spacingAndGlyphs">bdbv<tspan
        fill="#2a78d6">-hub-modelling</tspan></text>
</svg>
