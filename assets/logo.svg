<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" role="img">
  <title>BDBVForecasts</title>
  <!-- Forecast fan: 90% band and median after the forecast date -->
  <path d="M17 12L30 2V22.5Z" fill="#2a78d6" fill-opacity="0.3"/>
  <path d="M17 12L29.5 10.5" fill="none" stroke="#2a78d6"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- Time axis and vertical "now" line -->
  <path stroke="#0b0b0b" d="M2.5 27.5H29.5M17 5V27.5" fill="none"
        stroke-width="1.6" stroke-linecap="round"/>
  <!-- Observed onsets rising to the forecast date -->
  <path d="M3 23.5C8.5 23.5 11 12.5 17 12" fill="none" stroke="#2a78d6"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- Latest observation -->
  <circle cx="17" cy="12" r="3" fill="#eb6834"/>
  <text x="40" y="22.5" fill="#0b0b0b"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.3"
        textLength="136" lengthAdjust="spacingAndGlyphs">BDBV<tspan
        fill="#2a78d6">Forecasts</tspan></text>
</svg>
