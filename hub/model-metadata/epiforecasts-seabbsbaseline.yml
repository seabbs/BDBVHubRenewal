model_details:
  data_inputs: Hub target data (weekly confirmed cases by onset week, observed plus imputed), the hub's published onset-to-report delays and daily health zone counts.
  methods: Chain-ladder nowcast of recent onset weeks with negative binomial uncertainty, then persistence on each draw. Provinces, health zones and national.
  methods_long: A baseline model building on the ideas of the baselinenowcast paper and package (Johnson et al. 2025, Wellcome Open Research, doi:10.12688/wellcomeopenres.25027.2; https://github.com/epinowcast/baselinenowcast/). Recent onset weeks are nowcast with a chain ladder on the reporting triangle, with a negative binomial for each delay horizon fitted to past retrospective nowcasts. Each nowcast draw is carried forward as persistence, with log-scale random walk noise. Province samples are split across health zones, and the national value is the sum of provinces. See https://samabbott.co.uk/BDBVHubRenewal/methods/model/.
