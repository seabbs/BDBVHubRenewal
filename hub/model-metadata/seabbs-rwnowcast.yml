model_details:
  data_inputs: Hub daily onsets by release (observed plus imputed) for provinces and health zones, and the hub's weekly target data.
  methods: Baselinenowcast chain ladder on daily release snapshots with a Skellam observation model, then a log-scale random walk. Health zones and provinces, with national the sum of provinces.
  methods_long: The baselinenowcast method (Johnson et al. 2025, Wellcome Open Research, doi:10.12688/wellcomeopenres.25027.2; https://github.com/epinowcast/baselinenowcast/), from a JAX port of baselinenowcast 0.2.2, with a random walk on top. Daily onsets in the hub's weekly release snapshots are nowcast with a chain ladder. Unobserved report days are skipped, every release pair in the 42-day window is pooled, and each release is aged from its latest onset day. A place uses its own delay factor at an age if that factor rests on at least 10 cases, and otherwise its parent's (zone, then province, then national). Daily nowcasts are summed to hub weeks. The observation model is Skellam, with a spread by weeks back fitted to retrospective nowcasts against the count expected at the later release, so counts can be revised down. Each nowcast draw is carried forward from its latest week as a random walk on the log scale with Poisson noise. A place under 10 cases a week, or with fewer than 2 errors,
    uses the spreads of its parent. The national value is the sum of provinces. See https://samabbott.co.uk/BDBVHubRenewal/methods/baselines/.
