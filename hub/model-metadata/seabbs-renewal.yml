model_details:
  data_inputs: Hub target data (weekly confirmed cases by onset week, observed plus imputed, for the country, provinces and health zones), the hub's published onset-to-report delays by vintage, province populations and population-weighted province centres. The generation interval is BVDOutbreakSize's. The newest BVDOutbreakSize release published by the forecast's cut-off, for its Rt estimates.
  methods: Health zone renewal model in PyRenew with pooled Rt, gravity importation and depletion, with a tempered likelihood on BVDOutbreakSize Rt, fitted to known and imputed onsets; provinces are zone sums.
  methods_long: A renewal process for each health zone with recent cases, with a national weekly random walk on log Rt plus partially pooled province and zone deviations, importation between zones through a gravity kernel, and susceptible depletion. Zones with no recent case take a random walk introduction layer. Provinces are the sums of their zones. The model's national, province and zone Rt in the week of the newest BVDOutbreakSize release available at the cut-off are tied to that release's Rt estimates, as a likelihood term tempered by 0.5. Health zones are fitted and the national value is the sum of the province samples, each the sum of its zone samples. Zone WorldPop populations and population-weighted zone centres set the importation kernel between zones. Rt is dated by infection, and onsets are infections convolved with a log-normal incubation period with uncertain mean and SD (BVDOutbreakSize's priors). Confirmed onsets follow a time-varying ascertainment. The onset-to-report delay
    is nonparametric, a discrete hazard that is smooth over delay, with a national weekly shift and province offsets and weekly drifts partially pooled towards it. Known onsets are right truncated by it and by a report-to-publication lag on 0 to 7 days learnt from consecutive releases. The share of reports with no onset date is modelled by province. The hub's imputed onsets are modelled as the hub makes them, from cases missing an onset date by report day, back-sampled with the hub's delay. Weekly known and imputed counts are negative binomial and the delays of known onsets are Dirichlet-multinomial. Over the forecast weeks the log Rt walk reverts towards Rt of 1 with a half-life of 2 weeks. Fitted by NUTS (NumPyro) to each data vintage. Each sample is one joint posterior trajectory. See https://samabbott.co.uk/BDBVHubRenewal/methods/model/.
