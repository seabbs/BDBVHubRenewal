model_details:
  data_inputs: Hub target data (weekly confirmed cases by onset week, observed plus imputed, for the country, provinces and health zones), the hub's published onset-to-report delays by vintage, province populations and population-weighted province centres. The generation interval is BVDOutbreakSize's. The newest BVDOutbreakSize release published by the forecast's cut-off, for its Rt estimates.
  methods: A renewal model per health zone with pooled Rt, importation and depletion, with Rt tied to the newest BVDOutbreakSize estimates by a tempered likelihood. Provinces are zone sums.
  methods_long: 'We model infections in each health zone with recent cases with a renewal process in PyRenew. Log Rt is a national weekly random walk plus partially pooled province and zone deviations. Infections move between zones through a gravity kernel, and susceptibles are depleted. Zones with no recent case take a random walk introduction layer. The model''s national, province and zone Rt in the week of the newest BVDOutbreakSize release published by the cut-off are tied to that release''s Rt estimates by a likelihood term tempered by 0.5. Health zones are fitted. Each province is the sum of its zones and national is the sum of the provinces, sample by sample. Zone WorldPop populations and the centroids of each zone''s largest polygon set the importation kernel between zones. Rt is dated by infection. Onsets are infections convolved with a log-normal incubation period, with BVDOutbreakSize''s priors on its mean and SD. A time-varying share of onsets is confirmed. The onset-to-report
    delay is a discrete hazard, smooth over delay, with a national weekly shift and province offsets and drifts pooled towards it. Known onsets are right truncated by this delay and by a 0 to 7 day report-to-publication lag learnt from consecutive releases. The share of reports with no onset date is modelled by province. The hub''s imputed onsets are modelled as the hub makes them: cases with no onset date, back-sampled from report day with the hub''s delay. Weekly known and imputed counts are negative binomial, and the delays of known onsets are Dirichlet-multinomial. Over the forecast weeks log Rt reverts towards Rt = 1 with a half-life of 2 weeks. The model is fitted by NUTS (NumPyro) to each data release, and each sample is one joint posterior trajectory. See https://samabbott.co.uk/bdbv-hub-modelling/methods/model/.'
