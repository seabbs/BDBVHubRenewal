model_details:
  data_inputs: Hub target data (weekly confirmed cases by onset week, observed plus imputed) and the hub's published onset-to-report delays.
  methods: Last complete onset week carried forward per province, with log-scale random walk noise and Poisson draws; national is the sum of provinces.
  methods_long: For each province with cases, the last onset week judged complete (its midpoint at least the 90th centile of the published onset-to-report delay before the data date) is carried forward. Later weeks are drawn on the log scale as a random walk whose weekly SD is the SD of the last 8 complete weekly log changes (floored at 0.1), with Poisson noise. Earlier weeks are the published counts. Each sample is a joint trajectory and the national value is the sum of province samples. No spatial correlation beyond that sum. See https://seabbs.github.io/BDBVHubRenewal/methods/model/. Model code was drafted with the assistance of a language model and is under review by the named authors.
