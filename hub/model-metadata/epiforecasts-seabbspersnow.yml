model_details:
  data_inputs: Hub target data (weekly confirmed cases by onset week, observed plus imputed), the hub's published onset-to-report delays and daily health zone counts.
  methods: Recent onset weeks completed by a fast nowcast of reporting delays, then the last week carried forward with random walk noise. Provinces, health zones and national.
  methods_long: A persistence baseline on nowcast counts. Recent onset weeks are first completed for reporting delays with a fast nowcast (no MCMC). The last nowcast week is then carried forward, with log-scale random walk noise and Poisson draws, as in the persistence baseline. Province samples are split across health zones, and the national value is the sum of provinces. See https://seabbs.github.io/BDBVHubRenewal/methods/model/. Model code was drafted with the assistance of a language model and is under review by the named authors.
website_url: https://seabbs.github.io/BDBVHubRenewal/
