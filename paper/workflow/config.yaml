# Settings of the paper's evaluation workflow (`workflow/Snakefile`).
# Paths are relative to `paper/`.
results: results
# Where `publish` copies a run's outputs for main.qmd and si.qmd.
build: build
# The run `render` publishes first: development or paper.
render: development
studies: [synthetic, germany, ebola]
# Samples per forecast for the studies scored on samples.
n_samples: 100

# The simulated outbreaks of each run's seeds (`paperdata.synthetic`), and
# the models' forecasts of them, which the synthetic runner of #192
# writes as the paper's long table.
synthetic:
  # The simulator, whose code gives the grid tables and SI notes
  # (`evidence` below), and the held-out set's design.
  simulator: simulator
  grid: r3
  simulations_per_seed: 25
  blocks: [1670, 1671]
  draw: 1
  # The synthetic runner's protocol, quoted in the SI note.
  protocol: {min_releases: 6, horizon_weeks: 5, horizons: [-4, 3]}
  # The simulations of each run's seeds, whose settings give the grid's
  # realised values.
  simulations:
    development: ../output/finetune/pilot-r3
    paper: ../output/finetune/heldout
  # The synthetic runner's forecasts of them (#192), with its
  # observations and factors beside them.
  forecasts:
    development: ../output/paper/synthetic-dev.csv.gz
    paper: ../output/paper/synthetic.csv.gz

# The German benchmark, run with the `bdbvhubrenewal` command line
# (config/germany.toml). Its models are the config's `models`.
# `real: false` runs the study on dummy data.
germany:
  real: true
  config: ../config/germany.toml
  data: ../data/raw/germany
  results: ../results/germany
  # Further forecasts of the benchmark from evidence rows (`evidence`
  # below), such as models run outside config/germany.toml: `models`
  # keeps the models matching a regular expression, `suffix` renames
  # them, and `backtest` reads a `germany-backtest` table. A development
  # run fails if one holds a held-out date.
  # `provisional` notes what is to be redone, in every German caption.
  # The Chronos-2 models are in config/germany.toml.
  extra: []

# The Ebola study: samples of the release backtest of `backtest_models`
# from every past release, with the stored fits' (`bdbvhubrenewal
# backtest`, after `fit-store load` on CI), the hub's releases, and once
# the hub's baseline has a forecast with known truth, every team's
# forecasts, our stored forecasts and the fit store. `hub: null` runs the
# study on dummy data.
ebola:
  backtest: ../results/forecasts.csv.gz
  # Main's data, whose releases give the observations and truth, and the
  # backtest config, which sets D, as the release backtest takes them.
  data: ../data
  config: ../config/backtest.toml
  # Further models' release-backtest samples from evidence rows (`evidence`
  # below), in the backtest's layout, kept to `models`: the Chronos-2
  # models fine-tuned on 1,000 outbreaks, as submitted (one joint block),
  # until the fit store holds them. The other Chronos-2 models come from
  # the fit store.
  extra:
    - evidence: ebola_chronos
      models: ".*_n1000$"
  backtest_models: [randomwalk, randomwalknowcast]
  hub: ../data/raw/bdbv-hub
  hub_repo: https://github.com/InsightNet-US/BDBV-Modeling-Hub.git
  candidates: [../data/candidate-forecasts.csv.gz]
  store: ..
  store_ref: origin/fit-store

# What the nowcast panels show (`paperfigs.nowcasts`). The main panel
# shows the national series of a case study, or one synthetic outbreak;
# the SI shows the other places, or outbreaks covering the levels of
# `factors`. Outbreaks and origins are drawn with `seed`. Models without
# forecasts are left out.
nowcasts:
  seed: 20261114
  origins: 3
  outbreaks: 6
  # The places of the SI nowcast figure, one per entry: the largest,
  # median and smallest (with any cases) by recent count, and the most
  # rising and most falling (`paperfigs.nowcasts.pick_places`).
  place_rule: [largest, median, small, rising, falling]
  factors: [trajectory, delay_form, observation, strata]
  national: {germany: DE, ebola: CD}
  models:
    synthetic:
      [randomwalknowcast, fm_chronos_daily_ragged, fm_chronos_daily_ragged_ft]
    # With the hub teams' ensemble (hub_ensemble in the dummy data).
    germany:
      - randomwalknowcast
      - fm_chronos_daily_ragged
      - fm_chronos_daily_ragged_ft
      - fm_chronos_daily_ragged_ft_n1000
      - MeanEnsemble
      - hub_ensemble
    ebola:
      - randomwalknowcast
      - fm_chronos_weekly_ragged
      - fm_chronos_weekly_ragged_ft
      - fm_chronos_weekly_ragged_ft_n1000

# SI results from code not yet on main, as rows committed to evidence
# branches (`paperpipe.evidence`). Each is `{ref: <commit>, path: <file>}`;
# null leaves a note of what it waits on in a development run and fails a
# paper run.
evidence:
  # scripts/finetune_simulate.R of the r3 fine-tune (#235). Read from main,
  # with no pin, once #235 merges.
  simulator:
    ref: 6bcb6f2fa4a2f2f5978271a7d3d30e613ea3f939
    path: scripts/finetune_simulate.R
  # Scores of each r3 checkpoint on the case studies (germany-chronos2).
  checkpoint_scores:
    ref: a0ccfc67bc1471a2405eb4af3254310b087c92c3
    path: evidence/checkpoint-scores.csv
  # The scale-floor test (fm-finetune3).
  scale_floor:
    ref: 500fe77caed9fdf846cfac9270b0be4179e742ee
    path: results/finetune/scale-floor.csv
  # The lag-horizon test of the ragged layout (germany-chronos2).
  lag_germany:
    ref: e4f4d7a49773a3050a9529df5c70d7cc8504dafc
    path: results/germany-chronos-dev/scores.csv
  lag_bdbv_before:
    ref: e4f4d7a49773a3050a9529df5c70d7cc8504dafc
    path: evidence/bdbv-lagfix/fm-summary-before.csv
  lag_bdbv_after:
    ref: e4f4d7a49773a3050a9529df5c70d7cc8504dafc
    path: evidence/bdbv-lagfix/fm-summary-after.csv
  # The copula's arms scored by `evaluation.trajectories` (#237).
  copula_scores:
    ref: addbf7d86d01aca10f2a7ae8e63792c741cb5668
    path: results/copula-scores.csv.gz
  copula_rho:
    ref: addbf7d86d01aca10f2a7ae8e63792c741cb5668
    path: results/copula-rho.csv.gz
  aggregation_scores:
    ref: 5a3e0440880f54751fd8dccbfa14133a2a74ba81
    path: results/agg/aggregation-scores.csv.gz
  ebola_chronos:
    ref: 5a3e0440880f54751fd8dccbfa14133a2a74ba81
    path: results/agg/bdbv-joint-samples.csv.gz
  aggregation_cost:
    ref: 5a3e0440880f54751fd8dccbfa14133a2a74ba81
    path: results/agg/aggregation-cost.csv
  finetune_heldout:
    ref: 31ea2bf4c687f5c0ea85d9a880fa0f6cfcb3dce3
    path: results/finetune/finetune-heldout.csv
  sim_summaries:
    ref: 31ea2bf4c687f5c0ea85d9a880fa0f6cfcb3dce3
    path: results/finetune/sim-summaries-r3-pilot.csv
  sim_realism:
    ref: 31ea2bf4c687f5c0ea85d9a880fa0f6cfcb3dce3
    path: results/finetune/sim-realism-r3-pilot.csv
  sim_diseases:
    ref: 31ea2bf4c687f5c0ea85d9a880fa0f6cfcb3dce3
    path: results/finetune/sim-diseases-r3-pilot.csv

# Data the development runs use.
development:
  # The r3 pilot's outbreaks, for checking the setup.
  synthetic_seeds: [9501, 9502, 9503, 9504]

# Data kept out of every development run.
# Only the `paper` target reads them.
heldout:
  # Outbreaks simulated with seeds the fine-tune never saw.
  synthetic_seeds: [8016, 8017, 8018, 8019, 8020, 8021, 8022, 8023, 8024, 8025]
  # First held-out German nowcast date.
  # The benchmark's dates run from 2021-11-22 to 2022-04-29.
  # The first 80 are the development half.
  germany_from: "2022-02-10"

# Studies whose truth is the first release on or after D days, as the
# release backtest takes it, rather than the last release before.
truth_first_after: [ebola]

# D, the days after a target date at which the truth is taken.
# Synthetic outbreaks use their own 98% reporting delay.
# Ebola uses the release backtest's (config/backtest.toml).
truth_delay:
  germany: 40
