# Settings of the paper's evaluation workflow (`workflow/Snakefile`).
# Paths are relative to `paper/`.
results: results
# Where `publish` copies a run's outputs for main.qmd and si.qmd.
build: build
# The run `render` publishes first: development or paper.
render: development
studies: [synthetic, germany, ebola]
# Samples per forecast for the studies scored on samples.
n_samples: 200

# The simulated outbreaks of each run's seeds (`paperdata.synthetic`), and
# the models' forecasts of them, which the synthetic runner of #192
# writes as the paper's long table.
synthetic:
  simulations:
    development: ../output/finetune/validation
    paper: ../output/finetune/heldout
  forecasts:
    development: [../output/paper/synthetic-development.csv.gz]
    paper: [../output/paper/synthetic-paper.csv.gz]

# The German benchmark, run with the `bdbvhubrenewal` command line
# (config/germany.toml). Its models are the config's `models`.
# `real: false` runs the study on dummy data.
germany:
  real: true
  config: ../config/germany.toml
  data: ../data/raw/germany
  results: ../results/germany
  # Further forecasts of the benchmark from evidence rows (`evidence`
  # below), such as models run outside config/germany.toml: `models`
  # keeps the models matching a regular expression, `suffix` renames
  # them, and `backtest` reads a `germany-backtest` table. A development
  # run fails if one holds a held-out date.
  extra:
    - {evidence: germany_chronos, models: "^fm_chronos_"}
    - {evidence: germany_chronos_n1000, backtest: true, suffix: _n1000}

# The Ebola hub's data and forecasts, our stored forecasts and the fit
# store. `hub: null` runs the study on dummy data, as does a hub whose
# baseline has no forecast with known truth yet.
ebola:
  hub: ../data/raw/bdbv-hub
  hub_repo: https://github.com/InsightNet-US/BDBV-Modeling-Hub.git
  candidates: [../data/candidate-forecasts.csv.gz]
  store: ..
  store_ref: origin/fit-store

# What the nowcast panels show (`paperfigs.nowcasts`). The main panel
# shows the national series of a case study, or one synthetic outbreak;
# the SI shows the other places, or outbreaks covering the levels of
# `factors`. Outbreaks and origins are drawn with `seed`. Models without
# forecasts are left out.
nowcasts:
  seed: 20261114
  origins: 3
  outbreaks: 6
  factors: [trajectory, delay_form, observation, strata]
  national: {germany: DE, ebola: CD}
  models:
    synthetic:
      [randomwalknowcast, fm_chronos_daily_ragged, fm_chronos_daily_ragged_ft]
    # With the hub teams' ensemble (hub_ensemble in the dummy data).
    germany:
      - randomwalknowcast
      - fm_chronos_daily_ragged
      - fm_chronos_daily_ragged_ft
      - fm_chronos_daily_ragged_ft_n1000
      - MeanEnsemble
      - hub_ensemble
    ebola:
      - randomwalknowcast
      - fm_chronos_weekly_ragged
      - fm_chronos_weekly_ragged_ft

# SI results from code not yet on main, as rows committed to evidence
# branches (`paperpipe.evidence`). Each is `{ref: <commit>, path: <file>}`;
# null leaves a note of what it waits on in a development run and fails a
# paper run.
evidence:
  germany_chronos:
    ref: 1697968b1674f0f42eb784785fcae522d4576eff
    path: germany/chronos-paper-forecasts.csv.gz
  germany_chronos_n1000:
    ref: 1697968b1674f0f42eb784785fcae522d4576eff
    path: germany/n1000-ft-forecasts.csv.gz
  copula_scores: null
  copula_rho: null
  aggregation_scores: null
  aggregation_cost: null
  finetune_heldout: null
  sim_summaries: null
  sim_realism: null
  sim_diseases: null

# Data the development runs use.
development:
  # Validation outbreaks for checking the setup.
  synthetic_seeds: [7001]

# Data kept out of every development run.
# Only the `paper` target reads them.
heldout:
  # Outbreaks simulated with seeds the fine-tune never saw.
  synthetic_seeds: [9001, 9002, 9003, 9004]
  # First held-out German nowcast date.
  # The benchmark's dates run from 2021-11-22 to 2022-04-29.
  # The first 80 are the development half.
  germany_from: "2022-02-10"

# D, the days after a target date at which the truth is taken.
# Synthetic outbreaks use their own 98% reporting delay.
# Ebola uses the 98% point of the hub data's reporting delay.
truth_delay:
  germany: 40
