# Comparison with hub forecasts. Read by
# `bdbvhubrenewal.evaluation.hubcompare.load_comparison_config`.
# `bdbvhubrenewal compare-hub --fetch` downloads every team's metadata and
# weekly-round forecasts. Files under CC0-1.0 or CC-BY-4.0 are committed in
# data/hub-submissions/; others are cached in data/raw/hub-submissions/.
# The scores and plotted quantiles go to results/hub-comparison/.

[comparison]
# WIS is relative to this model, or to the registry baseline until it is
# registered.
baseline = "persistencenow"
# Forecasts of fitted models, which are too slow to run here, are taken
# from these files for the same rounds.
stored = [
  "results/heldout-forecasts.csv.gz",
  "results/forecasts.csv.gz",
  "output/backtest/forecasts.csv.gz",
]
# Locations shown in the plot of each round.
locations = ["CD", "CD-IT", "CD-NK"]
ref = "main"
