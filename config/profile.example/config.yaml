# An example Snakemake profile for a machine that needs more than
# workflow/profiles/default and its budget (flowlib.machine). Copy this
# folder to an untracked one (config/profile/ is ignored), set your
# values and name it in config/local.env as
# SNAKEMAKE_PROFILE=config/profile; it then replaces the default profile
# and budget for every target. The values below are placeholders.
rerun-triggers: [mtime]
printshellcmds: true
keep-going: true
latency-wait: 30
#cores: 8
default-resources:
  - mem_mb=2048
set-threads:
  - simulate_batch=1
resources:
  # One trainer at a time, batches at once, their shared memory budget
  # (MB), and one batch from another host waited for at a time.
  - gpu=1
  #- sim_slots=4
  #- mem_mb=32768
  - awaiting=1
