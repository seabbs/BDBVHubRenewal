# The hub model id of the renewal track: <team_abbr>-<model_abbr>.
# It does not follow the internal model keys (renewal, renewalsp,
# renewalbvd): whichever model the chain submits, the hub sees this id.
# Read by `bdbvhubrenewal.hub.submission_model_abbr`.

[submission]
model_abbr = "renewal"
# Where the chain in ci/policy.toml starts: renewalbvd, then renewalsp,
# then renewal, then the random walks. Without it, the latest entry of
# results/model-choice.yml.
model = "renewalbvd"
# Opt in: `true` submits this model each round (DRY_RUN still applies).
submit = true

# Further hub models, each submitted under its own id every round, apart
# from the chain above. The hub allows no hyphen in an abbreviation and
# fewer than 16 characters. Read by `bdbvhubrenewal.hub.model_abbr_for`.
# The random walk on a daily nowcast of the recent weeks.
[models.randomwalknowcast]
model_abbr = "rwnowcast"
submit = true

# The random walk from the latest complete week, with no nowcast.
[models.randomwalk]
model_abbr = "randomwalk"
submit = false
