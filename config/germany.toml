# German COVID-19 hospitalisation nowcast benchmark (Wolffram et al. 2023,
# PLOS Comp Biol, doi:10.1371/journal.pcbi.1011394). Read by
# `bdbvhubrenewal.evaluation.germany.load_germany_config`.
# `bdbvhubrenewal germany-fetch` downloads the triangle at this commit into
# data/raw/germany/, which is not committed. The data come from the
# Robert Koch Institute (CC BY 4.0) through the hub.

[hub]
# The reporting triangle by Meldedatum, as of 2022-08-08.
repo = "KITmetricslab/hospitalization-nowcast-hub"
commit = "11c745322c055cfbd4f0c8f72241642a50aea399"
triangle = "data-truth/COVID-19/COVID-19_hospitalizations.csv"

[nowcast]
# The paper's nowcast dates, every day of its evaluation period.
first_date = "2021-11-22"
last_date = "2022-04-29"
models = ["randomwalk", "randomwalknowcast"]
# Samples per forecast and seed, as the backtest.
n_samples = 100
seed = 20261027

[truth]
# Each 7-day sum is scored on the data reported this many days after it
# ends, the paper's 40-day truth.
delay = 40
