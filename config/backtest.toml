# Backtest settings. Read by `bdbv_hub_renewal.backtest.load_config`.

[forecast]
# Weeks in each forecast, as horizons in weeks from the reference date.
# -4 to -1 are nowcasts of past weeks, 0 is the reference week and 1 to 3
# are forecasts. The hub accepts up to +3.
min_horizon = -4
max_horizon = 3
n_samples = 100
seed = 20261027

[split]
# The model choice record. It logs the chosen model and every change, with
# dates. Development runs use vintages up to the latest choice date only.
# Every real vintage after the first choice date is held out and scored by
# `--evaluate-holdout` under the model chosen at the time.
# Every week is scored, against each later real vintage as reported then.
model_choice = "results/model-choice.yml"

[reconstructed]
# Saturdays to reconstruct pseudo-vintages for. Any after the latest model
# choice date are dropped.
first_vintage = "2026-06-06"
last_vintage = "2026-10-10"

[simulated]
# Vintage dates for the simulated outbreak (Saturdays).
first_vintage = "2026-06-27"
last_vintage = "2026-10-03"
