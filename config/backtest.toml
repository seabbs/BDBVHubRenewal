# Backtest settings. Read by `bdbvhubrenewal.backtest.load_config`.

[forecast]
# Weeks in each forecast, as horizons in weeks from the reference date.
# -4 to -1 are nowcasts of past weeks, 0 is the reference week and 1 to 3
# are forecasts. The hub accepts up to +3.
min_horizon = -4
max_horizon = 3
n_samples = 100
seed = 20261027

[split]
# Complete weeks are scored against each later real vintage.
# A truth week counts as complete if it ended at least this many weeks
# before the truth vintage.
complete_after_weeks = 3
# Real releases that are not backtest origins: they are neither fitted
# nor scored, but stay in the data of later origins. The 2026-08-18
# release has no delay file, is 50 days before the next and its old weeks
# are short by up to 12% of their latest counts, so its forecasts say
# little about how the models do now.
skip_origins = ["2026-08-18"]
# The release backtest scores each week's complete target on the first
# release whose cut-off is at least `truth_delay` days after the week
# ends, and leaves out weeks no release has reached yet. "auto" takes the
# age by which `truth_level` of the national count is reported, pooled
# over the releases (less skip_origins) against the latest one
# (`bdbvhubrenewal.evaluation.nowcast.reporting_delay`). A number of days
# fixes it.
truth_delay = "auto"
truth_level = 0.98

[sampler]
# NUTS settings of leave-one-province-out fits only. Stored backtest
# fits use each model's sampler table in ci/policy.toml
# (bdbvhubrenewal.evaluation.store). Settings in BDBV_RENEWAL_SAMPLER win
# over these.
num_chains = 2
num_warmup = 500
num_samples = 750
target_accept = 0.8
max_tree_depth = 10
chain_method = "parallel"

[bvd]
# The BVD variant uses the newest BVDOutbreakSize results release whose
# joint fit's worst R-hat is at most this. A generous check: effective
# sample sizes are ignored, and BVDOutbreakSize's own pass level is 1.05.
max_rhat = 1.1

[simulated]
# Vintage dates for the simulated outbreak (Saturdays).
first_vintage = "2026-06-27"
last_vintage = "2026-10-03"
